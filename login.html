<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>

<style>
/* ═══════════════════════════════════════
   CSS 변수 (대시보드와 동일)
   ═══════════════════════════════════════ */
:root{
  --deep:#003C7E; --posco:#0067B1; --bright:#3FA9F5; --tint:#E7F0FA;
  --bg:#EEF2F7; --card:#FFFFFF; --sunk:#F3F6FA;
  --ink:#0F1D2B; --body:#22374A; --sub:#5E7183; --faint:#93A5B5;
  --line:#DFE7EF;
  --warn:#B45309; --warn-bg:#FEF6E7;
  --stop:#D6273D; --stop-bg:#FFF3F5;
  --done:#0E8A6B; --done-bg:#EDFAF6;
  --r:18px; --r-s:14px; --r-xs:10px;
  --sh:0 2px 10px rgba(15,29,43,.06);
  --sh-m:0 4px 16px rgba(15,29,43,.09);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}

body{
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  color:var(--ink);line-height:1.5;font-size:15px;
  -webkit-font-smoothing:antialiased;
  background:linear-gradient(135deg,
    #003C7E 0%,
    #0067B1 45%,
    var(--bg) 45%,
    var(--bg) 100%);
  background-attachment:fixed;
  min-height:100vh;
}

/* ═══════════════════════════════════════
   로그인 콘텐츠 영역
   ═══════════════════════════════════════ */
.app{
  max-width:480px;margin:0 auto;min-height:100vh;
  position:relative;background:var(--bg);
  display:flex;flex-direction:column;
}

.login-hero{
  background:linear-gradient(135deg,var(--deep) 0%,var(--posco) 100%);
  color:#fff;padding:36px 24px 44px;position:relative;overflow:hidden;
  text-align:center;
}
.login-hero::after{
  content:'';position:absolute;right:-40px;top:-40px;width:160px;height:160px;
  background:repeating-linear-gradient(-45deg,rgba(255,255,255,.06) 0 8px,transparent 8px 16px);
  border-radius:50%;pointer-events:none;
}
.login-hero::before{
  content:'';position:absolute;left:-30px;bottom:-30px;width:120px;height:120px;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 6px,transparent 6px 12px);
  border-radius:50%;pointer-events:none;
}

.login-logo{
  font-size:56px;line-height:1;margin-bottom:12px;
  position:relative;z-index:1;
}
.login-brand-en{
  font-size:13px;font-weight:700;opacity:.9;letter-spacing:.06em;
  margin-bottom:4px;position:relative;z-index:1;
}
.login-brand-ko{
  font-size:22px;font-weight:800;letter-spacing:-.02em;
  margin-bottom:6px;position:relative;z-index:1;
}
.login-brand-sub{
  font-size:13px;font-weight:600;opacity:.85;
  position:relative;z-index:1;
}

/* 폼 영역 */
.login-body{
  flex:1;padding:20px 20px 24px;
  display:flex;flex-direction:column;gap:14px;
}

.warn-banner{
  background:var(--warn-bg);border-left:3px solid var(--warn);
  border-radius:0 var(--r-s) var(--r-s) 0;
  padding:11px 13px;
}
.warn-banner-title{
  font-size:12px;font-weight:800;color:var(--warn);
  margin-bottom:4px;letter-spacing:.02em;
}
.warn-banner-text{
  font-size:12px;color:var(--body);font-weight:600;
  line-height:1.5;
}

.field{display:flex;flex-direction:column;gap:6px}
.field label{
  font-size:12.5px;font-weight:800;color:var(--sub);
  padding-left:2px;letter-spacing:.02em;
}
.field-wrap{position:relative;display:flex;align-items:center;}
.field input{
  width:100%;padding:14px 14px;
  border:1.5px solid var(--line);border-radius:var(--r-s);
  background:var(--card);color:var(--ink);
  font-family:inherit;font-size:15px;font-weight:600;
  outline:none;transition:.15s;
}
.field input:focus{
  border-color:var(--posco);background:var(--card);
  box-shadow:0 0 0 3px rgba(0,103,177,.1);
}
.field input::placeholder{color:var(--faint);font-weight:500}

.pw-toggle{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  padding:8px 12px;background:transparent;border:0;
  color:var(--sub);font-size:12px;font-weight:700;
  cursor:pointer;border-radius:8px;font-family:inherit;
}
.pw-toggle:active{background:var(--sunk)}

.btn-login{
  margin-top:6px;padding:15px;
  background:linear-gradient(135deg,var(--deep) 0%,var(--posco) 100%);
  color:#fff;border:0;border-radius:var(--r-s);
  font-family:inherit;font-size:15px;font-weight:800;
  cursor:pointer;letter-spacing:-.02em;
  box-shadow:0 4px 14px rgba(0,60,126,.25);
  transition:.15s;
}
.btn-login:hover:not(:disabled){filter:brightness(1.05)}
.btn-login:active:not(:disabled){transform:scale(.98)}
.btn-login:disabled{opacity:.6;cursor:not-allowed;box-shadow:none}

.divider{
  display:flex;align-items:center;gap:10px;
  margin:6px 0;color:var(--faint);font-size:11px;font-weight:700;
}
.divider::before,.divider::after{
  content:"";flex:1;height:1px;background:var(--line);
}

.btn-tester{
  padding:13px;background:var(--card);
  border:1.5px solid var(--posco);border-radius:var(--r-s);
  color:var(--posco);
  font-family:inherit;font-size:14px;font-weight:800;
  cursor:pointer;letter-spacing:-.02em;
  transition:.15s;
}
.btn-tester:hover{background:var(--tint)}
.btn-tester:active{transform:scale(.98)}

.msg{
  min-height:0;padding:0 12px;
  font-size:12.5px;border-radius:10px;
  display:none;line-height:1.5;font-weight:600;
}
.msg.error{
  display:block;background:var(--stop-bg);color:var(--stop);
  border:1px solid rgba(214,39,61,.2);
  padding:10px 12px;
}
.msg.info{
  display:block;background:var(--tint);color:var(--posco);
  border:1px solid rgba(0,103,177,.2);
  padding:10px 12px;
}

.foot{
  padding:18px 20px 24px;text-align:center;
  font-size:11px;color:var(--sub);line-height:1.7;
  font-weight:600;border-top:1px solid var(--line);
  background:var(--sunk);
}
.foot strong{color:var(--posco);font-weight:800}

/* ═══════════════════════════════════════════════════════════
   📱 PC 전용 검은 휴대폰 프레임 (대시보드와 동일)
   ═══════════════════════════════════════════════════════════ */
@media (min-width: 768px) {

  html {
    width: 100% !important;
    height: 100% !important;
    min-height: 100vh !important;
    margin: 0 !important;
    padding: 0 !important;
    background: radial-gradient(ellipse at center,
      #e5e8ec 0%,
      #c8ccd2 60%,
      #a8adb4 100%) !important;
    overflow: hidden !important;
  }

  body {
    width: 100vw !important;
    max-width: 100vw !important;
    min-width: 100vw !important;
    height: 100vh !important;
    min-height: 100vh !important;
    max-height: 100vh !important;
    margin: 0 !important;
    padding: 0 !important;
    background: transparent !important;
    display: flex !important;
    flex-direction: row !important;
    align-items: center !important;
    justify-content: center !important;
    overflow: hidden !important;
    box-sizing: border-box !important;
    position: relative !important;
    inset: 0 !important;
  }

  /* 검은 휴대폰 프레임 본체 */
  .phone-frame {
    display: block !important;
    position: relative !important;
    width: 480px !important;
    height: 820px !important;
    max-height: calc(100vh - 40px) !important;
    background: #1a1a1a !important;
    border-radius: 52px !important;
    padding: 12px !important;
    box-shadow:
      0 40px 80px rgba(0,0,0,0.30),
      0 20px 40px rgba(0,0,0,0.20),
      0 8px 16px rgba(0,0,0,0.15),
      inset 0 0 0 2px #2a2a2a,
      inset 0 2px 8px rgba(255,255,255,0.05) !important;
    margin: 0 auto !important;
    box-sizing: border-box !important;
    flex-shrink: 0 !important;
    overflow: hidden !important;
  }

  /* 우측 전원 버튼 (장식) */
  .phone-frame::after {
    content: '' !important;
    position: absolute !important;
    right: -3px !important;
    top: 200px !important;
    width: 4px !important;
    height: 80px !important;
    background: linear-gradient(90deg, #2a2a2a 0%, #555 50%, #333 100%) !important;
    border-radius: 0 3px 3px 0 !important;
    box-shadow: 1px 0 2px rgba(0,0,0,0.3) !important;
    z-index: 10 !important;
  }

  /* 프레임 안쪽 화면 */
  .phone-screen {
    display: block !important;
    width: 100% !important;
    height: 100% !important;
    border-radius: 40px !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    background: var(--bg) !important;
    position: relative !important;
    box-sizing: border-box !important;
    scrollbar-width: none !important;
    -ms-overflow-style: none !important;
  }

  .phone-screen::-webkit-scrollbar {
    width: 0 !important;
    height: 0 !important;
    display: none !important;
  }

  .phone-frame .app {
    max-width: 100% !important;
    min-height: 100% !important;
    border-radius: 0 !important;
    box-shadow: none !important;
    margin: 0 !important;
  }
}

/* ═══════════════════════════════════════════════════════════
   모바일에서는 프레임 완전 무력화
   ═══════════════════════════════════════════════════════════ */
@media (max-width: 767px) {
  .phone-frame {
    display: block;
    width: 100%;
    height: auto;
    background: transparent;
    border-radius: 0;
    padding: 0;
    box-shadow: none;
  }
  .phone-frame::after {
    display: none;
  }
  .phone-screen {
    width: 100%;
    height: auto;
    border-radius: 0;
    overflow: visible;
  }
}
/* ═══════════════════════════════════════════════════════
 * 로그인 화면 채움 레이아웃 v2
 *
 * PC 프레임·모바일 Safari·홈 화면 바로가기 공통 적용
 * 키보드가 닫혀 있을 때는 한 화면, 열릴 때만 내부 스크롤
 * ═══════════════════════════════════════════════════════ */

:root{
  --login-viewport-height:100dvh;
}

/*
 * 앱은 상단 히어로와 로그인 본문의 2행 구조입니다.
 */
.phone-screen .app{
  width:100%;
  height:100%;
  min-height:0;
  display:grid;
  grid-template-rows:auto minmax(0,1fr);
  overflow:hidden;
}

.login-hero{
  flex-shrink:0;
}

.login-body{
  min-height:0;
  justify-content:center;
  overflow:hidden;
}

#loginForm{
  flex-shrink:0;
}

/* ───────────────────────────────────────
 * 모바일 Safari 및 홈 화면 바로가기
 * ─────────────────────────────────────── */
@media(max-width:767px){
  html,
  body{
    width:100%;
    height:var(
      --login-viewport-height,
      100dvh
    );
    min-height:0;
    margin:0;
    padding:0;
    overflow:hidden;
  }

  .phone-frame,
  .phone-screen{
    width:100%;
    max-width:none;
    height:var(
      --login-viewport-height,
      100dvh
    );
    min-height:0;
    margin:0;
    padding:0;
    overflow:hidden;
  }

  .phone-screen .app{
    width:100%;
    height:100%;
    min-height:0;
    margin:0;
    overflow:hidden;
  }

  .login-hero{
    padding:
      clamp(18px,4vh,34px)
      20px
      clamp(20px,4.5vh,38px);
  }

  .login-logo{
    margin-bottom:
      clamp(7px,1.5vh,12px);
    font-size:
      clamp(38px,7vh,54px);
  }

  .login-brand-en{
    margin-bottom:3px;
    font-size:
      clamp(10px,1.7vh,13px);
  }

  .login-brand-ko{
    margin-bottom:4px;
    font-size:
      clamp(18px,3vh,22px);
  }

  .login-brand-sub{
    font-size:
      clamp(11px,1.8vh,13px);
  }

  .login-body{
    padding:
      clamp(12px,2.4vh,20px)
      20px
      max(
        12px,
        env(safe-area-inset-bottom)
      );

    gap:
      clamp(8px,1.7vh,14px);

    justify-content:center;
  }

  #loginForm{
    gap:
      clamp(9px,1.7vh,14px)
      !important;
  }

  .warn-banner{
    padding:
      clamp(8px,1.4vh,11px)
      12px;
  }

  .warn-banner-title{
    margin-bottom:2px;
    font-size:
      clamp(10.5px,1.6vh,12px);
  }

  .warn-banner-text{
    font-size:
      clamp(10.5px,1.55vh,12px);
    line-height:1.45;
  }

  .field{
    gap:4px;
  }

  .field label{
    font-size:
      clamp(11px,1.6vh,12.5px);
  }

  .field input{
    min-height:
      clamp(44px,6.5vh,51px);

    padding:
      clamp(10px,1.8vh,14px)
      14px;

    font-size:
      clamp(14px,2vh,15px);
  }

  .btn-login{
    min-height:
      clamp(45px,6.7vh,51px);

    margin-top:2px;
    padding:
      clamp(11px,1.8vh,15px);

    font-size:
      clamp(14px,2vh,15px);
  }

  .divider{
    margin:
      clamp(1px,.7vh,6px)
      0;

    font-size:10px;
  }

  .btn-tester{
    min-height:
      clamp(44px,6.4vh,49px);

    padding:
      clamp(10px,1.7vh,13px);

    font-size:
      clamp(13px,1.9vh,14px);
  }

  .btn-tester + div{
    margin-top:0!important;
    font-size:
      clamp(9.5px,1.45vh,11.5px)
      !important;
    line-height:1.45!important;
  }

  .msg.error,
  .msg.info{
    padding:8px 10px;
    font-size:11px;
    line-height:1.4;
  }
}

/* ───────────────────────────────────────
 * 높이가 짧은 모바일 화면
 * ─────────────────────────────────────── */
@media(max-width:767px) and (max-height:700px){
  .login-hero{
    padding:15px 18px 17px;
  }

  .login-logo{
    margin-bottom:6px;
    font-size:36px;
  }

  .login-brand-en{
    font-size:9.5px;
  }

  .login-brand-ko{
    margin-bottom:2px;
    font-size:17px;
  }

  .login-brand-sub{
    font-size:10.5px;
  }

  .login-body{
    padding:
      9px
      16px
      max(
        8px,
        env(safe-area-inset-bottom)
      );

    gap:7px;
  }

  #loginForm{
    gap:8px!important;
  }

  .warn-banner{
    padding:7px 10px;
  }

  .warn-banner-title{
    font-size:10px;
  }

  .warn-banner-text{
    font-size:10px;
  }

  .field input{
    min-height:42px;
    padding:9px 12px;
    font-size:13.5px;
  }

  .btn-login,
  .btn-tester{
    min-height:42px;
    padding:9px 11px;
  }

  .divider{
    margin:0;
  }

  .btn-tester + div{
    font-size:9px!important;
    line-height:1.35!important;
  }
}

/* ───────────────────────────────────────
 * 키보드가 열린 모바일 화면
 *
 * 입력창과 로그인 버튼이 키보드에 가려지지 않도록
 * 로그인 본문 안에서만 스크롤을 허용합니다.
 * ─────────────────────────────────────── */
@media(max-width:767px){
  html.keyboard-open,
  html.keyboard-open body{
    overflow:hidden;
  }

  html.keyboard-open .phone-frame,
  html.keyboard-open .phone-screen,
  html.keyboard-open .app{
    height:var(
      --login-viewport-height,
      100dvh
    );
  }

  html.keyboard-open .login-hero{
    padding:8px 16px 9px;
  }

  html.keyboard-open .login-logo{
    display:none;
  }

  html.keyboard-open .login-brand-en{
    font-size:9px;
  }

  html.keyboard-open .login-brand-ko{
    margin-bottom:1px;
    font-size:15px;
  }

  html.keyboard-open .login-brand-sub{
    display:none;
  }

  html.keyboard-open .login-body{
    justify-content:flex-start;
    overflow-x:hidden;
    overflow-y:auto;
    padding:9px 16px 14px;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
  }

  html.keyboard-open .warn-banner{
    display:none;
  }

  html.keyboard-open .btn-tester,
  html.keyboard-open .divider,
  html.keyboard-open .btn-tester + div{
    display:none;
  }
}

/* ───────────────────────────────────────
 * 극단적으로 낮은 화면
 *
 * 콘텐츠 잘림을 방지하기 위해 로그인 본문만
 * 제한적으로 스크롤할 수 있게 합니다.
 * ─────────────────────────────────────── */
@media(max-width:767px) and (max-height:540px){
  .login-body{
    justify-content:flex-start;
    overflow-x:hidden;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
}

/* ───────────────────────────────────────
 * PC 모바일 프레임
 * ─────────────────────────────────────── */
@media(min-width:768px){
  .phone-frame{
    height:min(
      820px,
      calc(100vh - 40px)
    )!important;
  }

  .phone-screen{
    height:100%!important;
    overflow:hidden!important;
  }

  .phone-frame .app{
    width:100%!important;
    height:100%!important;
    min-height:0!important;
    display:grid!important;
    grid-template-rows:auto minmax(0,1fr);
    overflow:hidden!important;
  }

  .login-hero{
    padding:29px 22px 34px;
  }

  .login-logo{
    margin-bottom:9px;
    font-size:48px;
  }

  .login-body{
    min-height:0;
    padding:16px 20px 18px;
    gap:11px;
    justify-content:center;
    overflow:hidden;
  }

  #loginForm{
    gap:11px!important;
  }

  .field input{
    min-height:48px;
    padding:12px 14px;
  }

  .btn-login{
    min-height:48px;
    padding:12px;
  }

  .btn-tester{
    min-height:46px;
    padding:11px;
  }

  .divider{
    margin:2px 0;
  }
}
     
</style>
</head>
<body>

<!-- 대시보드와 동일한 프레임 구조 -->
<div class="phone-frame">
  <div class="phone-screen">
    <div class="app">

      <!-- 히어로 (DEVELOPMENT TEST 배지 삭제됨) -->
      <header class="login-hero">
        <div class="login-logo">🏭</div>
        <div class="login-brand-en">POSCO FUTURE M</div>
        <div class="login-brand-ko">안전관리앱</div>
       <div class="login-brand-sub">포항양극재공장 · 베타 테스트 버전</div>
      </header>

      <!-- 로그인 폼 -->
      <div class="login-body">

        <div class="warn-banner">
          <div class="warn-banner-title">🧪 현재 테스트 진행중입니다.</div>
          <div class="warn-banner-text">
            이 시스템에서 생성된 문서는 실제 작업허가로 사용할 수 없습니다.<br>
          </div>
        </div>

       <form id="loginForm" autocomplete="on" style="display:flex;flex-direction:column;gap:14px;">
          <div class="field">
            <label for="userId">아이디</label>

            <div class="field-wrap">
              <input
                type="text"
                id="userId"
                name="userId"
                placeholder="아이디 입력"
                autocomplete="username"
                autocapitalize="off"
                autocorrect="off"
                spellcheck="false"
              />
            </div>
          </div>



          <div class="field">
            <label for="userPw">비밀번호</label>
            <div class="field-wrap">
              <input
  type="password"
  id="userPw"
  name="userPw"
  placeholder="비밀번호 입력"
  autocomplete="current-password"
/>

              <button type="button" class="pw-toggle" id="pwToggle">보기</button>
            </div>
          </div>

          <button type="submit" class="btn-login" id="btnLogin">
            사용자 로그인
          </button>

          <div class="msg" id="loginMsg"></div>
        </form>

        <div class="divider">또는</div>

        <button type="button" class="btn-tester" id="btnTester">
          🧪 테스터로 체험하기
        </button>

        <div style="text-align:center;font-size:11.5px;color:var(--sub);font-weight:600;line-height:1.6;margin-top:2px;">
          로그인하지 않고 앱 기능을 체험합니다.<br>
          테스터 자료는 다른 사용자에게 공유되지 않고
          사진·서명·첨부파일은 저장되지 않습니다.<br>
        </div>
      </div>
    </div><!-- /.app -->
  </div><!-- /.phone-screen -->
</div><!-- /.phone-frame -->
<script>
(function(){
  'use strict';

  var initialViewportHeight =
    window.innerHeight;

  function currentViewportHeight(){
    if(
      window.visualViewport &&
      Number(
        window.visualViewport.height
      ) > 0
    ){
      return Number(
        window.visualViewport.height
      );
    }

    return window.innerHeight;
  }

  function updateLoginViewport(){
    var height =
      currentViewportHeight();

    document.documentElement
      .style.setProperty(
        '--login-viewport-height',
        Math.round(height) +
        'px'
      );

    /*
     * 초기 높이보다 150px 이상 줄어들면
     * 모바일 키보드가 열린 것으로 처리합니다.
     */
    var keyboardOpen =
      window.innerWidth <= 767 &&
      initialViewportHeight -
      height >
      150;

    document.documentElement
      .classList.toggle(
        'keyboard-open',
        keyboardOpen
      );
  }

  updateLoginViewport();

  window.addEventListener(
    'resize',
    updateLoginViewport,
    {
      passive:true
    }
  );

  window.addEventListener(
    'orientationchange',
    function(){
      setTimeout(
        function(){
          initialViewportHeight =
            window.innerHeight;

          updateLoginViewport();
        },
        180
      );
    },
    {
      passive:true
    }
  );

  if(window.visualViewport){
    window.visualViewport
      .addEventListener(
        'resize',
        updateLoginViewport,
        {
          passive:true
        }
      );

    window.visualViewport
      .addEventListener(
        'scroll',
        updateLoginViewport,
        {
          passive:true
        }
      );
  }

  document.addEventListener(
    'focusin',
    function(event){
      if(
        event.target &&
        (
          event.target.tagName ===
            'INPUT' ||
          event.target.tagName ===
            'TEXTAREA'
        )
      ){
        setTimeout(
          updateLoginViewport,
          80
        );
      }
    }
  );

  document.addEventListener(
    'focusout',
    function(){
      setTimeout(
        function(){
          initialViewportHeight =
            Math.max(
              initialViewportHeight,
              window.innerHeight
            );

          updateLoginViewport();
        },
        250
      );
    }
  );

  document.addEventListener(
    'visibilitychange',
    function(){
      if(
        document.visibilityState ===
          'visible'
      ){
        setTimeout(
          updateLoginViewport,
          60
        );
      }
    }
  );
})();
</script>

<!-- ═══════════════════════════════════════
     Firebase SDK (compat 방식 - 기존과 동일)
     ═══════════════════════════════════════ -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>

<script>
/* =========================================================
   Firebase 설정 (기존 값 그대로)
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyB7xLsGrG_tTH6ZQ1-Hz1HTQ1GPDq8sfzU",
  authDomain: "safety-management-platfo-5f413.firebaseapp.com",
  projectId: "safety-management-platfo-5f413",
  storageBucket: "safety-management-platfo-5f413.firebasestorage.app",
  messagingSenderId: "96226952530",
  appId: "1:96226952530:web:07e7cb286dc4e120cea68b",
  measurementId: "G-KNK5ECRCX5"
};

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}

const auth = firebase.auth();
const db   = firebase.firestore();

try {
  db.settings({
    experimentalForceLongPolling: true,
    merge: true
  });
} catch (e) { /* 이미 사용된 경우 무시 */ }

const AUTH_ID_DOMAIN = "pfm-safety.test";

/* =========================================================
   DOM
   ========================================================= */
const $form     = document.getElementById("loginForm");
const $id       = document.getElementById("userId");
const $pw       = document.getElementById("userPw");
const $btn      = document.getElementById("btnLogin");
const $msg      = document.getElementById("loginMsg");
const $pwToggle = document.getElementById("pwToggle");
const $tester   = document.getElementById("btnTester");

function showMsg(text, type){
  $msg.textContent = text;

  $msg.className =
    "msg " + (type || "error");

  $msg.style.display = "block";
}

function clearMsg(){
  $msg.textContent = "";
  $msg.className = "msg";
  $msg.style.display = "";
}

function toEmail(rawId){
  var id =
    String(rawId || "")
      .trim()
      .toLowerCase();

  if(!id){
    return "";
  }

  if(id.includes("@")){
    return id;
  }

  return (
    id +
    "@" +
    AUTH_ID_DOMAIN
  );
}

/*
 * 로그인 페이지와 다른 화면에서 공통으로 사용하는
 * 애플리케이션 세션을 제거합니다.
 */
function clearApplicationSession(){
  sessionStorage.removeItem(
    "appSession"
  );

  sessionStorage.removeItem(
    "userName"
  );

  sessionStorage.removeItem(
    "userRole"
  );

  sessionStorage.removeItem(
    "adminMode"
  );

  try{
    localStorage.removeItem(
      "appSession"
    );
  }catch(error){
    console.warn(
      "[세션] localStorage 정리 실패:",
      error
    );
  }
}

/*
 * 로그인 성공 또는 테스터 진입 시
 * 세션 키를 같은 형식으로 저장합니다.
 */
function saveApplicationSession(session){
  var serializedSession =
    JSON.stringify(session);

  sessionStorage.setItem(
    "appSession",
    serializedSession
  );

  sessionStorage.setItem(
    "userName",
    session.displayName || ""
  );

  sessionStorage.setItem(
    "userRole",
    session.role || ""
  );

  if(session.role === "admin"){
    sessionStorage.setItem(
      "adminMode",
      "true"
    );
  }else{
    sessionStorage.removeItem(
      "adminMode"
    );
  }

  try{
    localStorage.setItem(
      "appSession",
      serializedSession
    );
  }catch(error){
    console.warn(
      "[세션] localStorage 저장 실패:",
      error
    );
  }
}

/*
 * 로그인 화면에 진입하면 이전 앱 세션과
 * 남아 있는 Firebase 인증을 정리합니다.
 */
async function initializeLoginPage(){
  clearApplicationSession();

  try{
    if(auth.currentUser){
      await auth.signOut();
    }
  }catch(error){
    console.warn(
      "[로그인] 기존 Firebase 인증 정리 실패:",
      error
    );
  }

  if($id){
    $id.focus();
  }
}

const loginPageReady =
  initializeLoginPage();


/* 비밀번호 보기/숨기기 */
$pwToggle.addEventListener("click", () => {
  if($pw.type === "password"){
    $pw.type = "text";
    $pwToggle.textContent = "숨김";
  }else{
    $pw.type = "password";
    $pwToggle.textContent = "보기";
  }
});

/* =========================================================
   로그인 처리
   (대시보드 세션 키: 'appSession')
   ========================================================= */
$form.addEventListener(
  "submit",
  async function(event){
    event.preventDefault();
    clearMsg();

    var rawId =
      ($id.value || "").trim();

    var password =
      $pw.value || "";

    if(!rawId || !password){
      showMsg(
        "아이디와 비밀번호를 입력하세요.",
        "error"
      );

      return;
    }

    var email =
      toEmail(rawId);

    $btn.disabled = true;
    $tester.disabled = true;
    $btn.textContent = "로그인 중...";

    /*
     * 로그인 페이지의 이전 세션 정리가
     * 완료될 때까지 기다립니다.
     */
    await loginPageReady;

    /*
     * 새로운 인증이 완료되기 전에는
     * 이전 앱 세션을 사용하지 않습니다.
     */
    clearApplicationSession();

    try{
      /*
       * appSession이 sessionStorage이므로
       * Firebase 인증도 SESSION으로 맞춥니다.
       */
      await auth.setPersistence(
        firebase.auth.Auth.Persistence
          .SESSION
      );

      /*
       * 이전 Firebase 사용자가 남아 있다면
       * 새로운 로그인 전에 정리합니다.
       */
      if(auth.currentUser){
        await auth.signOut();
      }

      var credential =
        await auth
          .signInWithEmailAndPassword(
            email,
            password
          );

      var user =
        credential.user;

      if(!user || !user.uid){
        throw new Error(
          "Firebase 사용자 UID를 확인할 수 없습니다."
        );
      }

      console.log(
        "[로그인] Authentication 성공:",
        user.uid
      );

      var userSnapshot =
        await db
          .collection("users")
          .doc(user.uid)
          .get();

      console.log(
        "[로그인] users 문서 존재:",
        userSnapshot.exists
      );

      if(!userSnapshot.exists){
        await auth.signOut();

        showMsg(
          "등록되지 않은 계정입니다. 관리자에게 문의하세요.",
          "error"
        );

        return;
      }

      var data =
        userSnapshot.data() || {};

      console.log(
        "[로그인] 계정 확인:",
        {
          active: data.active,
          role: data.role,
          environment:
            data.environment
        }
      );

      if(data.active !== true){
        await auth.signOut();

        showMsg(
          "비활성 계정입니다.",
          "error"
        );

        return;
      }

      if(
        data.environment !==
        window.APP_MODE
      ){
        await auth.signOut();

        showMsg(
          "현재 테스트 환경에서 사용할 수 없는 계정입니다.",
          "error"
        );

        return;
      }

      if(
        data.role !== "admin" &&
        data.role !== "user"
      ){
        await auth.signOut();

        showMsg(
          "허용되지 않은 역할입니다.",
          "error"
        );

        return;
      }

      /*
       * 현재 Firebase 인증 토큰을 갱신하여
       * 인증 상태를 확정합니다.
       */
      await user.getIdToken(true);

      var session = {
        accessMode:
          "authenticated",

        role:
          data.role,

        uid:
          user.uid,

        displayName:
          data.displayName ||
          rawId,

        email:
          user.email ||
          email,

        environment:
          window.APP_MODE,

        issuedAt:
          new Date().toISOString(),

        source:
          "firebase-auth"
      };

      saveApplicationSession(
        session
      );

      console.log(
        "[로그인] 앱 세션 저장 완료:",
        {
          uid: session.uid,
          role: session.role,
          environment:
            session.environment
        }
      );

      window.location.replace(
        "안전관리플랫폼_대시보드_V6_.html"
      );

      return;


    }catch(error){
      console.error(
        "[로그인 오류]",
        error
      );

      clearApplicationSession();

      var text =
        "로그인에 실패했습니다.";

      switch(error.code){
        case "auth/invalid-credential":
        case "auth/wrong-password":
        case "auth/user-not-found":
          text =
            "아이디 또는 비밀번호가 올바르지 않습니다.";
          break;

        case "auth/too-many-requests":
          text =
            "로그인 시도가 많습니다. 잠시 후 다시 시도하세요.";
          break;

        case "auth/network-request-failed":
          text =
            "네트워크 오류가 발생했습니다.";
          break;

        case "auth/invalid-email":
          text =
            "아이디 형식이 올바르지 않습니다.";
          break;

        case "auth/user-disabled":
          text =
            "사용이 중지된 계정입니다.";
          break;
      }

      showMsg(
        text,
        "error"
      );

    }finally{
      $btn.disabled = false;
      $tester.disabled = false;

      $btn.textContent =
        "사용자 로그인";

      $tester.textContent =
        "🧪 테스터로 체험하기";
    }
  }
);


/* =========================================================
   테스터 진입
   ========================================================= */
$tester.addEventListener(
  "click",
  async function(){
    clearMsg();

    $tester.disabled = true;
    $btn.disabled = true;

    $tester.textContent =
      "테스터 환경 준비 중...";

    try{
      await loginPageReady;

      /*
       * 이전 관리자 또는 일반 사용자의
       * Firebase 인증을 반드시 종료합니다.
       */
      if(auth.currentUser){
        await auth.signOut();
      }

      clearApplicationSession();

      var testerSession = {
        accessMode:
          "tester",

        role:
          "tester",

        uid:
          null,

        displayName:
          "공개 테스터",

        email:
          "",

        environment:
          window.APP_MODE,

        issuedAt:
          new Date().toISOString(),

        source:
          "local-tester"
      };

      saveApplicationSession(
        testerSession
      );

      console.log(
        "[테스터] 로컬 세션 생성 완료:",
        testerSession
      );

      window.location.replace(
        "안전관리플랫폼_대시보드_V6_.html"
      );

    }catch(error){
      console.error(
        "[테스터] 진입 실패:",
        error
      );

      clearApplicationSession();

      showMsg(
        "테스터 환경을 준비하지 못했습니다. 다시 시도하세요.",
        "error"
      );

      $tester.disabled = false;
      $btn.disabled = false;

      $tester.textContent =
        "🧪 테스터로 체험하기";
    }
  }
);

console.log("[로그인] 페이지 준비 완료", {
  authDomain: firebaseConfig.authDomain,
  projectId: firebaseConfig.projectId,
  idDomain: AUTH_ID_DOMAIN
});
</script>
