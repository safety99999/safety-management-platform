<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<script>
(function(){
  try{
    var saved = localStorage.getItem('theme');
    var theme = saved || (window.matchMedia && 
      window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  }catch(e){}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0067B1">
<title>안전점검 · 컴팩트 체크리스트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="styles/device-frame.css?v=3">

<style>
:root{
  --deep:#003C7E; --posco:#0067B1; --bright:#3FA9F5; --tint:#E7F0FA;
  --bg:#EEF2F7; --card:#FFFFFF; --sunk:#F3F6FA;
  --ink:#0F1D2B; --body:#22374A; --sub:#5E7183; --faint:#93A5B5;
  --line:#DFE7EF;
  --ok:#0E8A6B; --ok-bg:#EDFAF6;
  --ng:#D6273D; --ng-bg:#FFF3F5;
  --part:#B45309; --part-bg:#FEF6E7;
  --na:#5E7183; --na-bg:#F3F6FA;
  --r:18px; --r-s:14px; --r-xs:10px;
  --sh:0 2px 10px rgba(15,29,43,.06);
  --sh-m:0 4px 16px rgba(15,29,43,.09);
}
[data-theme="dark"]{
  --deep:#0A1B2E; --posco:#3FA9F5; --bright:#6BC0FF; --tint:#12283F;
  --bg:#080F17; --card:#111E2C; --sunk:#0C1825;
  --ink:#F7FAFC; --body:#E2E8F0; --sub:#A0AEC0;
  --faint:#5A7288; --line:#1E3145;
  --ok:#3DD9AE; --ok-bg:#0D2620;
  --ng:#FF5F70; --ng-bg:#2B1116;
  --part:#FBBF24; --part-bg:#2A2010;
  --na:#A0AEC0; --na-bg:#0C1825;
  --sh:0 2px 10px rgba(0,0,0,.35);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;overflow-x:hidden;
  font-family:'Pretendard',-apple-system,sans-serif;}
body{
  color:var(--ink);line-height:1.5;font-size:15px;
  padding-bottom:max(20px,env(safe-area-inset-bottom));
  min-height:100vh;
  background:linear-gradient(135deg,var(--deep) 0%,var(--posco) 45%,var(--bg) 45%,var(--bg) 100%);
  background-attachment:fixed;
}
[data-theme="dark"] body{
  background:linear-gradient(135deg,#0A1B2E 0%,#12283F 45%,var(--bg) 45%,var(--bg) 100%);
}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;}
@media(min-width:768px){
  body{padding:24px 0 max(20px,env(safe-area-inset-bottom));}
  .app{min-height:calc(100vh - 48px);border-radius:24px;overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.15);}
}

/* ═══ TOP NAV ═══ */
.topnav{
  position:sticky;top:0;z-index:200;
  background:linear-gradient(158deg,var(--deep),var(--posco));
  height:56px;padding:0 16px;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 2px 12px rgba(0,60,126,.3);
}
.topnav-l{display:flex;align-items:center;gap:10px;min-width:0;}
.topnav-title{color:#fff;font-size:16px;font-weight:800;
  letter-spacing:-.03em;display:flex;align-items:center;gap:6px;}
.topnav-r{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.back-btn,.theme-btn,.home-btn{
  background:rgba(255,255,255,.16);border:none;color:#fff;
  border-radius:12px;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center;transition:.15s;
}
.back-btn{width:40px;height:40px;font-size:22px;}
.theme-btn{width:34px;height:34px;font-size:16px;}
.home-btn{width:40px;height:40px;font-size:20px;}
.back-btn:active,.theme-btn:active,.home-btn:active{transform:scale(.9);}
.permit-badge{background:rgba(255,255,255,.2);color:#fff;
  font-size:11px;font-weight:800;padding:5px 10px;border-radius:8px;
  font-variant-numeric:tabular-nums;}

.screen{padding:14px 12px;}

/* ═══ 헤더 정보 ═══ */
.inspector-card{
  background:var(--card);border-radius:var(--r-s);padding:12px 14px;
  margin-bottom:10px;box-shadow:var(--sh);
  display:flex;align-items:center;gap:10px;
}
.inspector-ico{
  width:38px;height:38px;background:var(--tint);border-radius:10px;
  display:grid;place-items:center;font-size:20px;flex-shrink:0;
}
.inspector-body{flex:1;min-width:0;}
.inspector-name{font-size:14px;font-weight:800;color:var(--ink);
  letter-spacing:-.02em;}
.inspector-meta{font-size:11.5px;color:var(--sub);font-weight:600;
  margin-top:2px;}
.inspector-edit{
  background:var(--sunk);border:1.5px solid var(--line);color:var(--sub);
  border-radius:8px;padding:6px 10px;font-size:11px;font-weight:700;
  cursor:pointer;font-family:inherit;
}

/* ═══ 진행률 바 ═══ */
.progress-card{
  background:var(--card);border-radius:var(--r-s);padding:12px 14px;
  margin-bottom:10px;box-shadow:var(--sh);
}
.progress-top{
  display:flex;justify-content:space-between;align-items:baseline;
  margin-bottom:8px;font-size:12px;font-weight:700;
}
.progress-label{color:var(--sub);}
.progress-value{color:var(--ink);font-size:14px;font-weight:800;
  font-variant-numeric:tabular-nums;}
.progress-value .ng-count{color:var(--ng);margin-left:8px;}
.progress-bar{
  height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;
}
.progress-fill{
  height:100%;background:linear-gradient(90deg,var(--posco),var(--bright));
  border-radius:4px;transition:width .3s;width:0%;
}

/* ═══ 체크리스트 항목 ═══ */
.checklist{background:var(--card);border-radius:var(--r);
  overflow:hidden;box-shadow:var(--sh);margin-bottom:10px;}
.check-item{
  padding:12px 14px;border-bottom:1px solid var(--line);
  display:flex;flex-direction:column;gap:8px;transition:background .15s;
}
.check-item:last-child{border-bottom:none;}
.check-item.done-ok{background:var(--ok-bg);}
.check-item.done-ng{background:var(--ng-bg);}
.check-item.done-part{background:var(--part-bg);}
.check-item.done-na{background:var(--na-bg);}

.ci-top{display:flex;align-items:flex-start;gap:8px;}
.ci-num{
  flex-shrink:0;width:22px;height:22px;
  background:var(--sunk);color:var(--sub);
  border-radius:6px;
  display:grid;place-items:center;
  font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;
}
.check-item.done-ok .ci-num{background:var(--ok);color:#fff;}
.check-item.done-ng .ci-num{background:var(--ng);color:#fff;}
.check-item.done-part .ci-num{background:var(--part);color:#fff;}
.check-item.done-na .ci-num{background:var(--na);color:#fff;}

.ci-text{flex:1;font-size:13.5px;font-weight:700;color:var(--ink);
  line-height:1.4;letter-spacing:-.02em;}
.ci-req{display:inline-block;font-size:10px;color:var(--sub);
  font-weight:800;background:var(--sunk);padding:1px 6px;border-radius:4px;
  margin-left:6px;vertical-align:1px;}
.check-item.done-ok .ci-req,
.check-item.done-ng .ci-req,
.check-item.done-part .ci-req,
.check-item.done-na .ci-req{background:rgba(255,255,255,.6);}

.ci-memo-btn{
  flex-shrink:0;width:26px;height:26px;background:transparent;
  border:1.5px solid var(--line);border-radius:8px;
  cursor:pointer;font-size:12px;color:var(--sub);
  display:grid;place-items:center;font-family:inherit;
}
.ci-memo-btn.has-memo{background:var(--tint);border-color:var(--posco);color:var(--posco);}

.ci-buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.ci-btn{
  padding:8px 4px;border:1.5px solid var(--line);
  background:var(--card);border-radius:9px;
  font-family:inherit;font-size:12px;font-weight:800;color:var(--sub);
  cursor:pointer;transition:.12s;
  display:flex;align-items:center;justify-content:center;gap:3px;
}
.ci-btn:active{transform:scale(.94);}
.ci-btn.active-ok{background:var(--ok);color:#fff;border-color:var(--ok);}
.ci-btn.active-ng{background:var(--ng);color:#fff;border-color:var(--ng);}
.ci-btn.active-part{background:var(--part);color:#fff;border-color:var(--part);}
.ci-btn.active-na{background:var(--na);color:#fff;border-color:var(--na);}

.ci-memo-input{
  display:none;width:100%;padding:8px 10px;
  background:var(--card);border:1.5px solid var(--line);
  border-radius:8px;font-family:inherit;font-size:12.5px;
  color:var(--ink);resize:vertical;min-height:52px;
}
.ci-memo-input.show{display:block;}
.ci-memo-input:focus{outline:none;border-color:var(--posco);}

/* ═══ 일괄준수 버튼 ═══ */
.bulk-apply-btn{
  width:100%;padding:14px;margin:12px 0;
  background:linear-gradient(135deg,var(--ok),#0E9E7A);
  color:#fff;border:none;border-radius:14px;
  font-family:inherit;font-size:15px;font-weight:800;
  cursor:pointer;letter-spacing:-.02em;
  box-shadow:0 4px 14px rgba(14,138,107,.28);
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.bulk-apply-btn:active{transform:scale(.98);}

/* ═══ 추가 입력란 ═══ */
.extra-section{
  background:var(--card);border-radius:var(--r-s);padding:14px;
  margin-bottom:10px;box-shadow:var(--sh);
}
.extra-title{
  font-size:13px;font-weight:800;color:var(--body);
  margin-bottom:8px;letter-spacing:-.02em;display:flex;align-items:center;gap:6px;
}
.extra-textarea{
  width:100%;padding:10px 12px;background:var(--sunk);
  border:1.5px solid var(--line);border-radius:10px;
  font-family:inherit;font-size:13px;color:var(--ink);
  resize:vertical;min-height:70px;line-height:1.5;
}
.extra-textarea:focus{outline:none;border-color:var(--posco);background:var(--card);}
.extra-textarea::placeholder{color:var(--faint);}

/* ═══ 사진 첨부 (하단 통합) ═══ */
.photo-section{
  background:var(--card);border-radius:var(--r-s);padding:14px;
  margin-bottom:10px;box-shadow:var(--sh);
}
.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.photo-slot{
  aspect-ratio:1;background:var(--sunk);border:2px dashed var(--line);
  border-radius:12px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;
  cursor:pointer;transition:.15s;position:relative;overflow:hidden;
}
.photo-slot:hover{border-color:var(--posco);background:var(--tint);}
.photo-slot-ico{font-size:26px;color:var(--faint);}
.photo-slot-txt{font-size:11px;color:var(--sub);font-weight:700;}
.photo-slot img{width:100%;height:100%;object-fit:cover;
  position:absolute;inset:0;}
.photo-del{
  position:absolute;top:6px;right:6px;
  width:26px;height:26px;background:rgba(0,0,0,.7);
  color:#fff;border:none;border-radius:50%;font-size:14px;
  cursor:pointer;display:grid;place-items:center;
}

/* ═══ 긴급 작업중지 버튼 ═══ */
.stop-work-cta{
  background:var(--ng-bg);border:1.5px dashed var(--ng);
  border-radius:var(--r-s);padding:12px;margin-bottom:12px;
  text-align:center;
}
.stop-work-hint{
  font-size:12px;color:var(--ng);font-weight:700;margin-bottom:8px;
}
.stop-work-btn{
  width:100%;padding:12px;background:linear-gradient(135deg,#8B1728,var(--ng));
  color:#fff;border:none;border-radius:12px;
  font-family:inherit;font-size:14px;font-weight:800;
  cursor:pointer;letter-spacing:-.02em;
  box-shadow:0 4px 12px rgba(214,39,61,.3);
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.stop-work-btn:active{transform:scale(.98);}

/* ═══ 하단 버튼 ═══ */
.bottom-btns{display:flex;gap:8px;padding:6px 0 4px;}
.btn-cancel,.btn-save{
  flex:1;padding:14px;border:none;border-radius:13px;
  font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;
  letter-spacing:-.02em;transition:.15s;
}
.btn-cancel:active,.btn-save:active{transform:scale(.98);}
.btn-cancel{background:var(--card);color:var(--sub);border:1.5px solid var(--line);}
.btn-save{flex:2;background:linear-gradient(135deg,var(--deep),var(--posco));
  color:#fff;box-shadow:0 4px 14px rgba(0,60,126,.28);}
.btn-save:disabled{background:var(--line);color:var(--faint);
  box-shadow:none;cursor:not-allowed;transform:none;}

/* ═══ TOAST & 다이얼로그 ═══ */
.toast-wrap{position:fixed;top:64px;left:50%;transform:translateX(-50%);
  z-index:9999;display:flex;flex-direction:column;gap:7px;
  pointer-events:none;width:90%;max-width:390px;}
.toast{padding:13px 17px;border-radius:12px;font-size:14px;font-weight:800;
  color:#fff;box-shadow:0 4px 20px rgba(0,0,0,.22);animation:tslide .3s ease;
  pointer-events:all;letter-spacing:-.02em;}
.toast.success{background:linear-gradient(135deg,#0B7A5F,var(--ok));}
.toast.danger{background:linear-gradient(135deg,#8B1728,var(--ng));}
.toast.warn{background:linear-gradient(135deg,#B45309,var(--part));}
.toast.info{background:linear-gradient(135deg,var(--deep),var(--posco));}
@keyframes tslide{from{opacity:0;transform:translateY(-12px);}
  to{opacity:1;transform:translateY(0);}}

.confirm-overlay{
  position:fixed;inset:0;background:rgba(6,17,28,.6);backdrop-filter:blur(4px);
  z-index:99999;opacity:0;pointer-events:none;transition:.25s;
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.confirm-overlay.active{opacity:1;pointer-events:auto;}
.confirm-modal{
  width:100%;max-width:340px;background:var(--card);border-radius:22px;
  padding:26px 22px 20px;box-shadow:0 25px 70px rgba(0,0,0,.3);
  transform:translateY(20px) scale(.95);transition:transform .28s;
}
.confirm-overlay.active .confirm-modal{transform:translateY(0) scale(1);}
.confirm-icon{font-size:44px;text-align:center;margin-bottom:12px;}
.confirm-title{font-size:18px;font-weight:800;color:var(--ink);
  text-align:center;margin-bottom:8px;letter-spacing:-.035em;}
.confirm-message{font-size:14px;color:var(--sub);font-weight:600;
  text-align:center;margin-bottom:20px;line-height:1.6;white-space:pre-wrap;}
.confirm-buttons{display:flex;gap:10px;}
.confirm-btn{flex:1;padding:14px;border:0;border-radius:13px;
  font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;transition:.15s;}
.confirm-btn:active{transform:scale(.97);}
.confirm-btn-cancel{background:var(--sunk);color:var(--sub);
  border:2px solid var(--line);}
.confirm-btn-ok{background:linear-gradient(135deg,var(--deep),var(--posco));color:#fff;}
.confirm-btn-ok.danger{background:linear-gradient(135deg,#8B1728,var(--ng));}
.confirm-btn-ok.warn{background:linear-gradient(135deg,#B45309,var(--part));}
.confirm-btn-ok.success{background:linear-gradient(135deg,#0B7A5F,var(--ok));}
</style>
</head>
<body>
<div class="phone-frame">
<div class="phone-screen">
<div class="app">

<!-- ═══ TOP NAV ═══ -->
<nav class="topnav">
  <div class="topnav-l">
    <button class="back-btn" onclick="goBack()" aria-label="뒤로가기">←</button>
    <div class="topnav-title">
      <span>🛡️</span><span>안전점검</span>
    </div>
  </div>
  <div class="topnav-r">
    <div class="permit-badge" id="permitBadge">PTW-000</div>
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">🌙</button>
    <button class="home-btn" onclick="goHome()">🏠</button>
  </div>
</nav>

<div class="toast-wrap" id="toastWrap"></div>

<div class="screen">

  <!-- 점검자 정보 -->
  <div class="inspector-card">
    <div class="inspector-ico">👤</div>
    <div class="inspector-body">
      <div class="inspector-name" id="inspectorName">홍길동</div>
      <div class="inspector-meta" id="inspectorMeta">안전관리팀 · 대리 · 시작 09:14</div>
    </div>
    <button class="inspector-edit" onclick="editInspector()">✏️ 수정</button>
  </div>

  <!-- 진행률 -->
  <div class="progress-card">
    <div class="progress-top">
      <span class="progress-label">📊 점검 진행률</span>
      <span class="progress-value">
        <span id="progressCount">0</span>/23
        <span class="ng-count" id="ngCount" style="display:none;">🚨 미준수 <span id="ngNum">0</span></span>
      </span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <!-- 체크리스트 -->
  <div class="checklist" id="checklist"></div>

  <!-- 일괄준수 -->
  <button class="bulk-apply-btn" onclick="bulkApplyOk()">
    <span>✅</span><span>미판정 항목 일괄 준수 처리</span>
  </button>

  <!-- 추가 입력란 -->
  <div class="extra-section">
    <div class="extra-title">📝 추가 확인사항 (선택)</div>
    <textarea class="extra-textarea" id="extraNotes" 
      placeholder="현장에서 추가로 확인한 사항이나 개선 필요 사항을 기재하세요"></textarea>
  </div>

  <!-- 사진 -->
  <div class="photo-section">
    <div class="extra-title">📷 현장 사진 (최대 2장)</div>
    <div class="photo-grid">
      <label class="photo-slot" id="photoSlot1" for="photoInput1">
        <div class="photo-slot-ico">📷</div>
        <div class="photo-slot-txt">사진 1</div>
      </label>
      <input type="file" id="photoInput1" accept="image/*" capture="environment" 
             style="display:none" onchange="onPhotoSelect(event,1)">
      <label class="photo-slot" id="photoSlot2" for="photoInput2">
        <div class="photo-slot-ico">📷</div>
        <div class="photo-slot-txt">사진 2</div>
      </label>
      <input type="file" id="photoInput2" accept="image/*" capture="environment" 
             style="display:none" onchange="onPhotoSelect(event,2)">
    </div>
  </div>

  <!-- 긴급 작업중지 CTA -->
  <div class="stop-work-cta">
    <div class="stop-work-hint">🛑 즉시 작업중지가 필요한 위험 상황인가요?</div>
    <button class="stop-work-btn" onclick="triggerStopWork(false)">
      <span>🚨</span><span>작업중지권 즉시 발동</span>
    </button>
  </div>

  <!-- 저장 버튼 -->
  <div class="bottom-btns">
    <button class="btn-cancel" onclick="cancelCheck()">취소</button>
    <button class="btn-save" onclick="saveCheck()">💾 저장하기</button>
  </div>

</div>

</div></div></div>

<!-- 커스텀 다이얼로그 -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-modal">
    <div class="confirm-icon" id="confirmIcon">⚠️</div>
    <div class="confirm-title" id="confirmTitle">확인</div>
    <div class="confirm-message" id="confirmMessage">진행하시겠습니까?</div>
    <div class="confirm-buttons">
      <button class="confirm-btn confirm-btn-cancel" onclick="closeConfirm(false)">취소</button>
      <button class="confirm-btn confirm-btn-ok" id="confirmOk" onclick="closeConfirm(true)">확인</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════
// 안전점검 v3.0 - 컴팩트 체크리스트
// ═══════════════════════════════════════
var CHECKLIST_ITEMS = [
  {no:1,  text:'작업허가서 발급 및 게시 확인',      required:true},
  {no:2,  text:'작업 전 TBM(위험성평가) 실시',       required:true},
  {no:3,  text:'개인보호구(PPE) 착용 상태',          required:true},
  {no:4,  text:'전원 차단 및 LOTO 실시',             required:true},
  {no:5,  text:'잔류에너지 및 잔류물 제거',          required:true},
  {no:6,  text:'회전체 정지 및 무동력 확인',         required:true},
  {no:7,  text:'밀폐공간 산소·유해가스 측정',        required:true},
  {no:8,  text:'화기작업 시 소화기 비치',            required:false},
  {no:9,  text:'고소작업 안전대·안전난간 확인',      required:true},
  {no:10, text:'중량물 취급 크레인·슬링 점검',       required:false},
  {no:11, text:'감시자 배치 및 통신수단 확보',       required:false},
  {no:12, text:'비상연락망 및 대피경로 확인',        required:false},
  {no:13, text:'작업구역 출입통제 및 표지판',        required:false},
  {no:14, text:'조명 및 시야 확보 상태',             required:false},
  {no:15, text:'절연공구 및 접지 상태',              required:false},
  {no:16, text:'인화성 물질 격리 조치',              required:false},
  {no:17, text:'환기설비 가동 상태',                 required:false},
  {no:18, text:'작업발판·계단 안전 상태',            required:false},
  {no:19, text:'정리정돈 및 통로 확보',              required:false},
  {no:20, text:'유해화학물질 MSDS 비치',             required:false},
  {no:21, text:'작업자 건강상태 및 피로도',          required:false},
  {no:22, text:'기상 조건(강풍·강우) 확인',          required:false},
  {no:23, text:'주변 동시작업 간섭 여부',            required:false}
];

var checkState = {};
var startTime = new Date();
var inspector = { name:'홍길동', dept:'안전관리팀', position:'대리' };
var photos = { p1:null, p2:null };
var permitNo = '';
var workId = '';
var workName = '';
var location = '';

// ═══ INIT ═══
window.addEventListener('DOMContentLoaded', function(){
  initTheme();
  loadInspectorFromSession();
  loadPermitFromUrl();
  renderChecklist();
  updateProgress();
  updateInspectorDisplay();
  
  // ESC
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){
      var ov = document.getElementById('confirmOverlay');
      if(ov && ov.classList.contains('active')) closeConfirm(false);
    }
  });
  document.getElementById('confirmOverlay').addEventListener('click', function(e){
    if(e.target === this) closeConfirm(false);
  });
});

// ═══ 세션에서 점검자 정보 로드 ═══
function loadInspectorFromSession(){
  try{
    var raw = localStorage.getItem('appSession');
    if(!raw) return;
    var s = JSON.parse(raw);
    if(s.name) inspector.name = s.name;
    if(s.dept || s.department) inspector.dept = s.dept || s.department;
    if(s.position) inspector.position = s.position;
  }catch(e){}
}

function updateInspectorDisplay(){
  var timeStr = pad(startTime.getHours()) + ':' + pad(startTime.getMinutes());
  document.getElementById('inspectorName').textContent = inspector.name;
  document.getElementById('inspectorMeta').textContent = 
    inspector.dept + ' · ' + inspector.position + ' · 시작 ' + timeStr;
}

function editInspector(){
  var name = prompt('이름', inspector.name);
  if(name === null) return;
  var dept = prompt('부서', inspector.dept);
  if(dept === null) return;
  var pos = prompt('직위', inspector.position);
  if(pos === null) return;
  inspector.name = name || inspector.name;
  inspector.dept = dept || inspector.dept;
  inspector.position = pos || inspector.position;
  updateInspectorDisplay();
  showToast('점검자 정보 수정됨', 'success');
}

// ═══ URL에서 허가서 정보 로드 ═══
function loadPermitFromUrl(){
  try{
    var params = new URLSearchParams(window.location.search);
    permitNo = params.get('permitNo') || 'PTW-' + fmtDate(new Date()).replace(/-/g,'') + '-001';
    workId = params.get('workId') || '';
    document.getElementById('permitBadge').textContent = permitNo;
    
    if(workId){
      var raw = localStorage.getItem('safetyDatabase');
      if(raw){
        var db = JSON.parse(raw);
        var work = (db.workHistory || []).find(function(w){
          var wid = w.workId || (w.date + '_' + (w.originalNo || ''));
          return wid === workId;
        });
        if(work){
          workName = work.workName || work.workNameFull || '';
          location = work.locationRaw || (work.location && work.location.raw) || '';
        }
      }
    }
  }catch(e){}
}

// ═══ 체크리스트 렌더링 ═══
function renderChecklist(){
  var html = '';
  CHECKLIST_ITEMS.forEach(function(item){
    html += renderCheckItem(item);
  });
  document.getElementById('checklist').innerHTML = html;
}

function renderCheckItem(item){
  return '' +
    '<div class="check-item" id="item-' + item.no + '">' +
      '<div class="ci-top">' +
        '<div class="ci-num">' + item.no + '</div>' +
        '<div class="ci-text">' +
          escHtml(item.text) +
          (item.required ? '<span class="ci-req">필수</span>' : '') +
        '</div>' +
        '<button class="ci-memo-btn" id="memo-btn-' + item.no + '" onclick="toggleMemo(' + item.no + ')">💬</button>' +
      '</div>' +
      '<div class="ci-buttons">' +
        '<button class="ci-btn" onclick="setJudgment(' + item.no + ',\'ok\')" data-j="ok">⭕ 준수</button>' +
        '<button class="ci-btn" onclick="setJudgment(' + item.no + ',\'ng\')" data-j="ng">❌ 미준수</button>' +
        '<button class="ci-btn" onclick="setJudgment(' + item.no + ',\'part\')" data-j="part">△ 부분</button>' +
        '<button class="ci-btn" onclick="setJudgment(' + item.no + ',\'na\')" data-j="na">− NA</button>' +
      '</div>' +
      '<textarea class="ci-memo-input" id="memo-' + item.no + '" placeholder="사유·비고 (선택)" onchange="saveMemo(' + item.no + ')"></textarea>' +
    '</div>';
}

// ═══ 판정 처리 ═══
function setJudgment(no, judgment){
  checkState[no] = checkState[no] || {};
  checkState[no].judgment = judgment;
  
  var item = document.getElementById('item-' + no);
  item.classList.remove('done-ok','done-ng','done-part','done-na');
  item.classList.add('done-' + judgment);
  
  var btns = item.querySelectorAll('.ci-btn');
  btns.forEach(function(b){
    b.classList.remove('active-ok','active-ng','active-part','active-na');
    if(b.getAttribute('data-j') === judgment){
      b.classList.add('active-' + judgment);
    }
  });
  
  // 미준수/부분 선택 시 메모창 자동 오픈
  if(judgment === 'ng' || judgment === 'part'){
    var memoBtn = document.getElementById('memo-btn-' + no);
    var memoInput = document.getElementById('memo-' + no);
    if(!memoInput.classList.contains('show')){
      memoInput.classList.add('show');
      memoBtn.classList.add('has-memo');
    }
  }
  
  updateProgress();
}

function toggleMemo(no){
  var input = document.getElementById('memo-' + no);
  var btn = document.getElementById('memo-btn-' + no);
  input.classList.toggle('show');
  if(input.classList.contains('show')){
    btn.classList.add('has-memo');
    input.focus();
  } else if(!input.value.trim()){
    btn.classList.remove('has-memo');
  }
}

function saveMemo(no){
  var input = document.getElementById('memo-' + no);
  var btn = document.getElementById('memo-btn-' + no);
  checkState[no] = checkState[no] || {};
  checkState[no].memo = input.value.trim();
  if(checkState[no].memo){
    btn.classList.add('has-memo');
  } else {
    btn.classList.remove('has-memo');
  }
}

// ═══ 진행률 업데이트 ═══
function updateProgress(){
  var done = 0, ng = 0;
  CHECKLIST_ITEMS.forEach(function(item){
    var s = checkState[item.no];
    if(s && s.judgment) done++;
    if(s && s.judgment === 'ng') ng++;
  });
  
  document.getElementById('progressCount').textContent = done;
  document.getElementById('progressFill').style.width = (done/23*100) + '%';
  
  var ngWrap = document.getElementById('ngCount');
  if(ng > 0){
    ngWrap.style.display = 'inline';
    document.getElementById('ngNum').textContent = ng;
  } else {
    ngWrap.style.display = 'none';
  }
}

// ═══ 일괄준수 ═══
function bulkApplyOk(){
  var unchecked = CHECKLIST_ITEMS.filter(function(item){
    return !checkState[item.no] || !checkState[item.no].judgment;
  });
  
  if(unchecked.length === 0){
    showToast('이미 모든 항목이 판정되었습니다', 'info');
    return;
  }
  
  showConfirm({
    icon:'✅',
    title:'일괄 준수 처리',
    message:'미판정 ' + unchecked.length + '개 항목을\n모두 "준수"로 처리하시겠습니까?\n\n이력에 [일괄처리]로 기록됩니다.',
    okText:'일괄 처리',
    okType:'success'
  }, function(ok){
    if(!ok) return;
    unchecked.forEach(function(item){
      checkState[item.no] = { judgment:'ok', memo:'', appliedByAll:true };
      var el = document.getElementById('item-' + item.no);
      el.classList.add('done-ok');
      var btns = el.querySelectorAll('.ci-btn');
      btns.forEach(function(b){
        if(b.getAttribute('data-j') === 'ok') b.classList.add('active-ok');
      });
    });
    updateProgress();
    showToast('✅ ' + unchecked.length + '개 항목 일괄 준수 처리됨', 'success');
  });
}

// ═══ 사진 첨부 ═══
function onPhotoSelect(event, slot){
  var file = event.target.files[0];
  if(!file) return;
  if(file.size > 5*1024*1024){
    showToast('사진 크기가 5MB를 초과합니다', 'warn');
    return;
  }
  var reader = new FileReader();
  reader.onload = function(e){
    photos['p'+slot] = e.target.result;
    var slotEl = document.getElementById('photoSlot'+slot);
    slotEl.innerHTML = '<img src="' + e.target.result + '"><button class="photo-del" onclick="removePhoto(event,' + slot + ')">×</button>';
    showToast('사진 ' + slot + ' 첨부됨', 'success');
  };
  reader.readAsDataURL(file);
}

function removePhoto(event, slot){
  event.preventDefault();
  event.stopPropagation();
  photos['p'+slot] = null;
  var slotEl = document.getElementById('photoSlot'+slot);
  slotEl.innerHTML = '<div class="photo-slot-ico">📷</div><div class="photo-slot-txt">사진 ' + slot + '</div>';
  document.getElementById('photoInput'+slot).value = '';
}

// ═══ 저장 ═══
function saveCheck(){
  var done = 0, ng = 0, ngRequired = [];
  CHECKLIST_ITEMS.forEach(function(item){
    var s = checkState[item.no];
    if(s && s.judgment){
      done++;
      if(s.judgment === 'ng'){
        ng++;
        if(item.required) ngRequired.push(item);
      }
    }
  });
  
  if(done < 23){
    showConfirm({
      icon:'⚠️',
      title:'미판정 항목 있음',
      message:(23-done) + '개 항목이 미판정 상태입니다.\n그래도 저장하시겠습니까?',
      okText:'저장',
      okType:'warn'
    }, function(ok){
      if(ok) executeSave(ngRequired);
    });
    return;
  }
  
  executeSave(ngRequired);
}

function executeSave(ngRequired){
  var record = {
    inspectionNo: 'INS-' + fmtDate(new Date()).replace(/-/g,'') + '-' + Date.now().toString().slice(-4),
    permitNo: permitNo,
    workId: workId,
    workName: workName,
    location: location,
    inspector: inspector,
    startTime: startTime.toISOString(),
    endTime: new Date().toISOString(),
    items: CHECKLIST_ITEMS.map(function(item){
      var s = checkState[item.no] || {};
      return {
        no: item.no,
        text: item.text,
        required: item.required,
        judgment: s.judgment || null,
        memo: s.memo || '',
        appliedByAll: s.appliedByAll || false
      };
    }),
    extraNotes: document.getElementById('extraNotes').value.trim(),
    photos: [photos.p1, photos.p2].filter(function(p){return p;}),
    createdAt: new Date().toISOString()
  };
  
  try{
    var list = JSON.parse(localStorage.getItem('safetyInspections') || '[]');
    list.push(record);
    localStorage.setItem('safetyInspections', JSON.stringify(list));
    
    // 필수 항목 미준수 → 작업중지권 자동 발동
    if(ngRequired.length > 0){
      showConfirm({
        icon:'🚨',
        title:'중대 위반 감지',
        message:'필수 항목 ' + ngRequired.length + '건이 미준수입니다.\n\n작업중지권 화면으로 이동합니다.\n(안전점검은 저장되었습니다)',
        okText:'이동',
        okType:'danger'
      }, function(){
        triggerStopWork(true, ngRequired, record);
      });
      return;
    }
    
    showToast('✅ 안전점검이 저장되었습니다', 'success');
    setTimeout(function(){ goHome(); }, 1200);
    
  }catch(e){
    showToast('저장 실패: ' + e.message, 'danger');
  }
}

// ═══ 작업중지권 발동 ═══
function triggerStopWork(auto, violations, savedRecord){
  var stopData = {
    workId: workId,
    permitNo: permitNo,
    workName: workName,
    location: location,
    stopDescription: auto 
      ? '안전점검 중 필수 항목 ' + (violations||[]).length + '건 미준수로 자동 발동'
      : '안전점검 진행 중 위험 감지로 즉시 발동',
    stopReasons: ['기타 위험'],
    requesterName: inspector.name,
    requesterDept: inspector.dept,
    requesterPosition: inspector.position,
    violations: (violations || []).map(function(v){
      var s = checkState[v.no] || {};
      return {
        no: v.no,
        text: v.text,
        memo: s.memo || '(사유 미기재)'
      };
    }),
    fromInspection: true,
    inspectionNo: savedRecord ? savedRecord.inspectionNo : null,
    triggerAt: new Date().toISOString()
  };
  
  if(!auto){
    // 수동 발동 시 확인
    showConfirm({
      icon:'🚨',
      title:'작업중지권 발동',
      message:'즉시 작업중지권 화면으로 이동합니다.\n\n현재까지의 판정은 임시저장됩니다.',
      okText:'이동',
      okType:'danger'
    }, function(ok){
      if(!ok) return;
      // 판정 임시저장
      localStorage.setItem('inspectionDraft', JSON.stringify({
        checkState: checkState,
        photos: photos,
        extraNotes: document.getElementById('extraNotes').value.trim(),
        savedAt: new Date().toISOString()
      }));
      localStorage.setItem('pendingStopWorkOrder', JSON.stringify(stopData));
      window.location.href = '작업중지권_v2.html?from=inspection';
    });
    return;
  }
  
  // 자동 발동
  localStorage.setItem('pendingStopWorkOrder', JSON.stringify(stopData));
  window.location.href = '작업중지권_v2.html?from=inspection';
}

// ═══ 취소 (이어서) ═══
function cancelCheck(){
  var hasData = Object.keys(checkState).length > 0;
  if(!hasData){ goHome(); return; }
  showConfirm({
    icon:'⚠️',
    title:'작성 취소',
    message:'작성 중인 내용이 삭제됩니다.\n계속하시겠습니까?',
    okText:'취소하고 나가기',
    okType:'warn'
  }, function(ok){
    if(ok) goHome();
  });
}

// ═══ 홈 / 뒤로가기 ═══
function goHome(){
  window.location.href = '안전관리플랫폼_대시보드_V6_.html';
}

function goBack(){
  var hasData = Object.keys(checkState).length > 0;
  if(!hasData){ history.back(); return; }
  showConfirm({
    icon:'⚠️',
    title:'뒤로 가기',
    message:'작성 중인 내용이 삭제됩니다.\n계속하시겠습니까?',
    okText:'나가기',
    okType:'warn'
  }, function(ok){
    if(ok) history.back();
  });
}

// ═══ 테마 ═══
function initTheme(){
  var saved = localStorage.getItem('theme');
  applyTheme(saved || 'light');
}

function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  var btn = document.getElementById('themeBtn');
  if(btn) btn.textContent = t === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('theme', t);
}

function toggleTheme(){
  var c = document.documentElement.getAttribute('data-theme') || 'light';
  applyTheme(c === 'dark' ? 'light' : 'dark');
}

// ═══ 커스텀 다이얼로그 ═══
var confirmCallback = null;

function showConfirm(options, callback){
  var opts = options || {};
  document.getElementById('confirmIcon').textContent = opts.icon || '⚠️';
  document.getElementById('confirmTitle').textContent = opts.title || '확인';
  document.getElementById('confirmMessage').textContent = opts.message || '';
  
  var okBtn = document.getElementById('confirmOk');
  okBtn.textContent = opts.okText || '확인';
  okBtn.className = 'confirm-btn confirm-btn-ok';
  if(opts.okType === 'danger') okBtn.classList.add('danger');
  else if(opts.okType === 'warn') okBtn.classList.add('warn');
  else if(opts.okType === 'success') okBtn.classList.add('success');
  
  confirmCallback = callback || function(){};
  document.getElementById('confirmOverlay').classList.add('active');
}

function closeConfirm(result){
  document.getElementById('confirmOverlay').classList.remove('active');
  var cb = confirmCallback;
  confirmCallback = null;
  if(typeof cb === 'function') setTimeout(function(){ cb(result); }, 150);
}

// ═══ TOAST ═══
function showToast(msg, type){
  var wrap = document.getElementById('toastWrap');
  if(!wrap) return;
  var t = document.createElement('div');
  t.className = 'toast ' + (type || 'info');
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(function(){
    if(t.parentNode) t.parentNode.removeChild(t);
  }, 3000);
}

// ═══ 유틸 ═══
function pad(n){ return ('0' + n).slice(-2); }
function fmtDate(d){
  d = d || new Date();
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
}
function escHtml(s){
  return String(s || '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}
