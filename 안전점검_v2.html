<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<script>
/* 다크모드 사전 적용 (깜빡임 방지) */
(function(){
  try{
    var saved = localStorage.getItem('theme');
    var theme = saved || (window.matchMedia && 
      window.matchMedia('(prefers-color-scheme: dark)').matches 
      ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  }catch(e){}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0067B1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>안전점검 · Safety Inspection</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="styles/device-frame.css?v=3">

<!-- APP MODE + Firebase -->
<script>
(function(){
  var urlMode = new URLSearchParams(location.search).get('mode');
  if(urlMode === 'test' || urlMode === 'prod'){
    localStorage.setItem('appMode', urlMode === 'test' ? 'test' : 'production');
  }
  window.APP_MODE = localStorage.getItem('appMode') || 'test';
  window.COLLECTION_PREFIX = window.APP_MODE === 'test' ? 'test_' : '';
  window.getCollectionName = function(baseName){
    return window.COLLECTION_PREFIX + baseName;
  };
  console.log(
    '%c[APP MODE] ' + window.APP_MODE.toUpperCase(),
    'background:' + (window.APP_MODE === 'test' ? '#dc3545' : '#28a745') +
    ';color:white;padding:4px 12px;border-radius:4px;font-weight:bold;'
  );
})();
</script>

<script type="module">
  import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
  import { getFirestore, initializeFirestore, doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB7xLsGrG_tTH6ZQ1-Hz1HTQ1GPDq8sfzU",
    authDomain: "safety-management-platfo-5f413.firebaseapp.com",
    projectId: "safety-management-platfo-5f413",
    storageBucket: "safety-management-platfo-5f413.appspot.com",
    messagingSenderId: "96226952530",
    appId: "1:96226952530:web:07e7cb286dc4e120cea68b"
  };

  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
  const needsLongPolling = isIOS || isSafari;

  const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
  let db;
  try {
    db = needsLongPolling 
      ? initializeFirestore(app, { experimentalForceLongPolling: true, useFetchStreams: false })
      : getFirestore(app);
  } catch (e) { db = getFirestore(app); }

  window.firebaseApp = { db, doc, setDoc, getDoc, serverTimestamp };
  window.firebaseApp.INSPECTION_COLLECTION = window.getCollectionName("safetyInspections");
  window.firebaseApp.PERMIT_COLLECTION = window.getCollectionName("safetyPermits");
  console.log("[안전점검 Firebase] 초기화 완료");
</script>

<style>
:root{
  --deep:#003C7E; --posco:#0067B1; --bright:#3FA9F5; --tint:#E7F0FA;
  --bg:#EEF2F7; --card:#FFFFFF; --sunk:#F3F6FA;
  --ink:#0F1D2B; --body:#22374A; --sub:#5E7183; --faint:#93A5B5;
  --line:#DFE7EF;
  --run:#E8590C; --run-bg:#FFF4EC;
  --stop:#D6273D; --stop-bg:#FFF3F5;
  --done:#0E8A6B; --done-bg:#EDFAF6;
  --warn:#B45309; --warn-bg:#FEF6E7;
  --r:18px; --r-s:14px;
  --sh:0 2px 10px rgba(15,29,43,.06);
}
[data-theme="dark"]{
  --deep:#0A1B2E; --posco:#3FA9F5; --bright:#6BC0FF; --tint:#12283F;
  --bg:#080F17; --card:#111E2C; --sunk:#0C1825;
  --ink:#F7FAFC; --body:#E2E8F0; --sub:#A0AEC0;
  --faint:#5A7288; --line:#1E3145;
  --run:#FF8A3D; --run-bg:#2A1A0E;
  --stop:#FF5F70; --stop-bg:#2B1116;
  --done:#3DD9AE; --done-bg:#0D2620;
  --warn:#FBBF24; --warn-bg:#2A2010;
  --sh:0 2px 10px rgba(0,0,0,.35);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;overflow-x:hidden;font-family:'Pretendard',-apple-system,sans-serif;}

body{
  color:var(--ink);line-height:1.5;font-size:16px;
  padding-bottom:max(20px,env(safe-area-inset-bottom));
  min-height:100vh;
  background:linear-gradient(135deg,var(--deep) 0%,var(--posco) 45%,var(--bg) 45%,var(--bg) 100%);
  background-attachment:fixed;
}
[data-theme="dark"] body{
  background:linear-gradient(135deg,#0A1B2E 0%,#12283F 45%,var(--bg) 45%,var(--bg) 100%);
}

.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;}

@media(min-width:768px){
  body{padding:24px 0;}
  .app{
    min-height:calc(100vh - 48px);border-radius:24px;overflow:hidden;
    box-shadow:0 0 40px rgba(0,103,177,.2),0 20px 60px rgba(0,0,0,.15);
  }
}

/* TOP NAV */
.topnav{
  position:sticky;top:0;z-index:200;
  background:linear-gradient(158deg,var(--deep) 0%,var(--posco) 100%);
  height:56px;padding:0 16px;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 2px 16px rgba(0,103,177,.35);
  overflow:hidden;
}
.topnav::after{
  content:'';position:absolute;right:-40px;top:-46px;width:150px;height:150px;
  background:repeating-linear-gradient(-45deg,rgba(255,255,255,.08) 0 9px,transparent 9px 18px);
  border-radius:50%;pointer-events:none;
}
.topnav-l{display:flex;align-items:center;gap:10px;position:relative;z-index:1;}
.topnav-title{color:#fff;font-size:16px;font-weight:800;letter-spacing:-.03em;display:flex;align-items:center;gap:6px;}
.topnav-r{display:flex;align-items:center;gap:8px;position:relative;z-index:1;}

.back-btn,.theme-btn,.home-btn{
  background:rgba(255,255,255,.16);border:none;color:#fff;
  border-radius:12px;font-size:20px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:.15s;
}
.back-btn{width:40px;height:40px;font-size:22px;}
.theme-btn{width:34px;height:34px;font-size:16px;}
.home-btn{width:40px;height:40px;}
.back-btn:active,.theme-btn:active,.home-btn:active{transform:scale(.9);background:rgba(255,255,255,.3);}

.permit-badge{
  background:rgba(255,255,255,.2);color:#fff;
  font-size:11px;font-weight:800;padding:5px 10px;border-radius:8px;
  font-variant-numeric:tabular-nums;
}
.permit-badge:empty{display:none;}

/* MAIN */
.main{padding:16px 14px;}

/* 상단 정보 카드 */
.info-card{
  background:var(--card);border-radius:var(--r);padding:16px;
  margin-bottom:12px;box-shadow:var(--sh);
}
.info-card-title{
  font-size:13px;font-weight:800;color:var(--sub);
  margin-bottom:8px;letter-spacing:.5px;text-transform:uppercase;
  display:flex;align-items:center;gap:6px;
}
.info-row{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;}
.info-key{color:var(--sub);font-weight:700;}
.info-val{color:var(--ink);font-weight:700;text-align:right;max-width:65%;word-break:break-word;}

/* 진행률 */
.progress-wrap{
  background:var(--card);border-radius:var(--r);padding:14px 16px;
  margin-bottom:12px;box-shadow:var(--sh);
}
.progress-top{
  display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;
}
.progress-label{font-size:13px;font-weight:800;color:var(--body);}
.progress-count{
  background:var(--tint);color:var(--posco);
  font-size:12px;font-weight:900;padding:4px 10px;border-radius:8px;
  font-variant-numeric:tabular-nums;
}
[data-theme="dark"] .progress-count{background:#1a2f4a;color:var(--bright);}
.progress-bar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;}
.progress-fill{
  height:100%;background:linear-gradient(90deg,var(--posco),var(--done));
  transition:width .3s ease;border-radius:4px;
}
.progress-fill.warn{background:linear-gradient(90deg,var(--warn),var(--stop));}

/* 카테고리 */
.category-section{
  background:var(--card);border-radius:var(--r);
  margin-bottom:12px;box-shadow:var(--sh);overflow:hidden;
}
.category-header{
  padding:14px 16px;border-bottom:1.5px solid var(--line);
  display:flex;align-items:center;gap:8px;
  background:linear-gradient(135deg,var(--tint) 0%,var(--card) 100%);
}
[data-theme="dark"] .category-header{background:linear-gradient(135deg,#1a2f4a 0%,var(--card) 100%);}
.category-ico{font-size:22px;}
.category-title{font-size:15px;font-weight:800;color:var(--ink);flex:1;letter-spacing:-.02em;}
.category-progress{
  font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px;
  background:var(--sunk);color:var(--sub);
}
.category-progress.complete{background:var(--done-bg);color:var(--done);}

/* 점검 항목 */
.check-item{
  padding:14px 16px;border-bottom:1px solid var(--line);
}
.check-item:last-child{border-bottom:none;}
.check-item.violation{background:var(--stop-bg);}
.check-item-top{
  display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;
}
.check-num{
  flex-shrink:0;width:26px;height:26px;background:var(--sunk);color:var(--sub);
  border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:800;
}
.check-num.done{background:var(--done);color:#fff;}
.check-num.ng{background:var(--stop);color:#fff;}
.check-body{flex:1;min-width:0;}
.check-text{color:var(--ink);font-size:14px;font-weight:700;line-height:1.5;letter-spacing:-.02em;}
.check-required{
  display:inline-block;font-size:10px;font-weight:800;color:var(--stop);
  margin-left:6px;padding:1px 6px;background:var(--stop-bg);border-radius:4px;vertical-align:2px;
}

/* 판정 버튼 (3단계: 준수/미준수/해당없음) */
.judge-btns{
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;
}
.judge-btn{
  padding:10px 6px;border:2px solid var(--line);border-radius:10px;
  background:var(--card);color:var(--sub);
  font-size:12.5px;font-weight:800;cursor:pointer;transition:.15s;
  display:flex;align-items:center;justify-content:center;gap:4px;
  min-height:42px;
}
.judge-btn:active{transform:scale(.96);}
.judge-btn.active-ok{border-color:var(--done);background:var(--done);color:#fff;box-shadow:0 2px 8px rgba(14,138,107,.3);}
.judge-btn.active-ng{border-color:var(--stop);background:var(--stop);color:#fff;box-shadow:0 2px 8px rgba(214,39,61,.3);}
.judge-btn.active-na{border-color:var(--sub);background:var(--sub);color:#fff;}

/* 메모 (미준수 시) */
.violation-memo{
  margin-top:10px;padding:10px 12px;background:var(--stop-bg);
  border-radius:10px;border-left:3px solid var(--stop);
}
.violation-memo-input{
  width:100%;padding:8px 10px;border:1.5px solid var(--stop);border-radius:8px;
  background:var(--card);color:var(--ink);font-family:inherit;font-size:13px;
  min-height:60px;resize:vertical;
}
.violation-memo-label{
  font-size:11px;font-weight:800;color:var(--stop);
  margin-bottom:6px;letter-spacing:-.01em;
}

/* 사진 첨부 (하단 통합) */
.photo-section{
  background:var(--card);border-radius:var(--r);padding:14px 16px;
  margin-bottom:12px;box-shadow:var(--sh);
}
.photo-title{
  font-size:14px;font-weight:800;color:var(--ink);
  margin-bottom:10px;letter-spacing:-.02em;
  display:flex;align-items:center;gap:6px;
}
.photo-hint{font-size:11px;color:var(--sub);font-weight:600;margin-left:auto;}
.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.photo-slot{
  aspect-ratio:1;border:2px dashed var(--line);border-radius:12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;background:var(--sunk);cursor:pointer;transition:.15s;
  position:relative;overflow:hidden;
}
.photo-slot:hover{border-color:var(--posco);background:var(--tint);}
.photo-slot.filled{border-style:solid;border-color:var(--done);padding:0;}
.photo-slot.filled img{width:100%;height:100%;object-fit:cover;}
.photo-slot-ico{font-size:32px;color:var(--faint);line-height:1;}
.photo-slot-txt{font-size:12px;color:var(--sub);font-weight:700;}
.photo-remove{
  position:absolute;top:6px;right:6px;
  width:26px;height:26px;background:rgba(0,0,0,.7);color:#fff;
  border:none;border-radius:50%;font-size:14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}

/* 종합 의견 */
.opinion-section{
  background:var(--card);border-radius:var(--r);padding:14px 16px;
  margin-bottom:12px;box-shadow:var(--sh);
}
.opinion-title{
  font-size:14px;font-weight:800;color:var(--ink);
  margin-bottom:10px;letter-spacing:-.02em;
  display:flex;align-items:center;gap:6px;
}
.opinion-input{
  width:100%;padding:12px 14px;border:1.5px solid var(--line);
  border-radius:10px;background:var(--sunk);color:var(--ink);
  font-family:inherit;font-size:14px;font-weight:600;
  min-height:80px;resize:vertical;
}
.opinion-input:focus{outline:none;border-color:var(--posco);background:var(--card);}

/* 하단 버튼 */
.btn-row{display:flex;gap:10px;margin-top:14px;}
.btn-primary,.btn-secondary,.btn-danger{
  flex:1;padding:16px;border:none;border-radius:13px;
  font-family:inherit;font-size:15px;font-weight:800;
  cursor:pointer;letter-spacing:-.02em;transition:.15s;
}
.btn-primary:active,.btn-secondary:active,.btn-danger:active{transform:scale(.98);}
.btn-primary{
  background:linear-gradient(135deg,var(--deep),var(--posco));color:#fff;
  box-shadow:0 4px 14px rgba(0,60,126,.28);
}
.btn-primary:disabled{background:var(--line);color:var(--faint);box-shadow:none;cursor:not-allowed;transform:none;}
.btn-secondary{background:var(--card);color:var(--sub);border:2px solid var(--line);}
.btn-danger{
  background:linear-gradient(135deg,#8B1728,var(--stop));color:#fff;
  box-shadow:0 4px 14px rgba(214,39,61,.28);
}

/* 경고 배너 */
.warn-banner{
  background:var(--warn-bg);border-left:4px solid var(--warn);
  border-radius:0 12px 12px 0;padding:12px 14px;margin-bottom:12px;
}
.warn-banner-t{font-size:13px;font-weight:800;color:var(--warn);margin-bottom:4px;}
.warn-banner-b{font-size:12.5px;color:var(--body);line-height:1.6;font-weight:600;}
.warn-banner-b strong{color:var(--stop);}

/* TOAST */
.toast-wrap{
  position:fixed;top:64px;left:50%;transform:translateX(-50%);
  z-index:9999;display:flex;flex-direction:column;gap:7px;
  pointer-events:none;width:90%;max-width:390px;
}
.toast{
  padding:13px 17px;border-radius:12px;font-size:14px;font-weight:800;color:#fff;
  display:flex;align-items:center;gap:8px;
  box-shadow:0 4px 20px rgba(0,0,0,.22);
  animation:tslide .3s ease;pointer-events:all;
}
.toast.success{background:linear-gradient(135deg,#0B7A5F,var(--done));}
.toast.danger{background:linear-gradient(135deg,#8B1728,var(--stop));}
.toast.info{background:linear-gradient(135deg,var(--deep),var(--bright));}
.toast.warn{background:linear-gradient(135deg,#B45309,var(--warn));}
@keyframes tslide{from{opacity:0;transform:translateY(-12px);}to{opacity:1;transform:translateY(0);}}

/* 다이얼로그 */
.confirm-overlay{
  position:fixed;inset:0;background:rgba(6,17,28,.6);backdrop-filter:blur(4px);
  z-index:99999;opacity:0;pointer-events:none;transition:.25s;
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.confirm-overlay.active{opacity:1;pointer-events:auto;}
.confirm-modal{
  width:100%;max-width:340px;background:var(--card);
  border-radius:22px;padding:26px 22px 20px;
  box-shadow:0 25px 70px rgba(0,0,0,.3);
}
.confirm-ico{font-size:44px;text-align:center;margin-bottom:12px;}
.confirm-title{font-size:18px;font-weight:800;color:var(--ink);text-align:center;margin-bottom:8px;}
.confirm-msg{font-size:14px;color:var(--sub);font-weight:600;text-align:center;margin-bottom:20px;line-height:1.6;white-space:pre-wrap;}
.confirm-btns{display:flex;gap:10px;}
.confirm-btn{
  flex:1;padding:14px;border:0;border-radius:13px;
  font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;
}
.confirm-btn-cancel{background:var(--sunk);color:var(--sub);border:2px solid var(--line);}
.confirm-btn-ok{background:linear-gradient(135deg,var(--deep),var(--posco));color:#fff;}
.confirm-btn-ok.danger{background:linear-gradient(135deg,#8B1728,var(--stop));}
.confirm-btn-ok.warn{background:linear-gradient(135deg,#B45309,var(--warn));}

@media(max-width:360px){
  .judge-btn{font-size:11px;padding:9px 4px;}
  .btn-row{flex-wrap:wrap;}
}
</style>
</head>
<body>
<div class="phone-frame">
<div class="phone-screen">
<div class="app">

<!-- TOP NAV -->
<nav class="topnav">
  <div class="topnav-l">
    <button class="back-btn" onclick="goBack()" aria-label="뒤로가기">←</button>
    <div class="topnav-title">
      <span>🛡️</span>
      <span>안전점검</span>
    </div>
  </div>
  <div class="topnav-r">
    <div class="permit-badge" id="permitBadge"></div>
    <button class="theme-btn" onclick="toggleTheme()">🌙</button>
    <button class="home-btn" onclick="goHome()">🏠</button>
  </div>
</nav>

<div class="toast-wrap" id="toastWrap"></div>

<div class="main">
  <!-- 작업 정보 -->
  <div class="info-card" id="workInfo" style="display:none;">
    <div class="info-card-title">
      <span>📋</span><span>점검 대상 작업</span>
    </div>
    <div class="info-row"><span class="info-key">허가번호</span><span class="info-val" id="infoPermitNo">-</span></div>
    <div class="info-row"><span class="info-key">작업명</span><span class="info-val" id="infoWorkName">-</span></div>
    <div class="info-row"><span class="info-key">장소</span><span class="info-val" id="infoLocation">-</span></div>
    <div class="info-row"><span class="info-key">점검자</span><span class="info-val" id="infoInspector">-</span></div>
  </div>

  <!-- 진행률 -->
  <div class="progress-wrap">
    <div class="progress-top">
      <span class="progress-label">📊 점검 진행률</span>
      <span class="progress-count" id="progressCount">0 / 0</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>
  </div>

  <!-- 경고 배너 (미준수 발생 시) -->
  <div class="warn-banner" id="warnBanner" style="display:none;">
    <div class="warn-banner-t">⚠️ 미준수 항목 발견</div>
    <div class="warn-banner-b" id="warnBannerMsg">
      미준수 항목 <strong>0건</strong>이 있습니다. 개선 조치가 필요합니다.
    </div>
  </div>

  <!-- 카테고리별 체크리스트 -->
  <div id="checklistContainer"></div>

  <!-- 종합 의견 -->
  <div class="opinion-section">
    <div class="opinion-title">
      <span>💬</span><span>종합 의견 (선택)</span>
    </div>
    <textarea class="opinion-input" id="opinionInput" 
              placeholder="점검 결과에 대한 종합 의견이나 특이사항을 기재하세요"></textarea>
  </div>

  <!-- 사진 첨부 (하단 통합) -->
  <div class="photo-section">
    <div class="photo-title">
      <span>📷</span><span>현장 사진</span>
      <span class="photo-hint">최대 2장 · 5MB 이하</span>
    </div>
    <div class="photo-grid">
      <label class="photo-slot" id="photoSlot1" for="photoInput1">
        <div class="photo-slot-ico">📷</div>
        <div class="photo-slot-txt">사진 1</div>
      </label>
      <input type="file" id="photoInput1" accept="image/*" capture="environment" 
             style="display:none" onchange="onPhotoSelect(event, 1)">

      <label class="photo-slot" id="photoSlot2" for="photoInput2">
        <div class="photo-slot-ico">📷</div>
        <div class="photo-slot-txt">사진 2</div>
      </label>
      <input type="file" id="photoInput2" accept="image/*" capture="environment" 
             style="display:none" onchange="onPhotoSelect(event, 2)">
    </div>
  </div>

  <!-- 저장 버튼 -->
  <div class="btn-row">
    <button class="btn-secondary" onclick="goBack()">취소</button>
    <button class="btn-primary" style="flex:2;" id="saveBtn" onclick="saveInspection()" disabled>
      💾 점검 결과 저장
    </button>
  </div>
</div>

</div></div></div>

<!-- 커스텀 다이얼로그 -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-modal">
    <div class="confirm-ico" id="confirmIco">⚠️</div>
    <div class="confirm-title" id="confirmTitle">확인</div>
    <div class="confirm-msg" id="confirmMsg">진행하시겠습니까?</div>
    <div class="confirm-btns" id="confirmBtns">
      <button class="confirm-btn confirm-btn-cancel" onclick="closeConfirm(false)">취소</button>
      <button class="confirm-btn confirm-btn-ok" id="confirmOkBtn" onclick="closeConfirm(true)">확인</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════
// 안전점검 v1.0 - 통합 안전 체크리스트 기반
// 저장: localStorage.safetyInspections
// 필수 미준수 시 → 작업중지권 자동 발동
// ═══════════════════════════════════════

// ═══ STATE ═══
var inspectionData = {
  inspectionNo: '',
  workId: '',
  permitNo: '',
  workName: '',
  location: '',
  inspectorName: '',
  inspectorDept: '',
  checklist: [],
  photos: [null, null],
  opinion: '',
  status: '',
  createdAt: ''
};

var selectedPermit = null;

// ═══ 기본 체크리스트 (허가서에 없을 때 사용) ═══
var DEFAULT_CHECKLIST = [
  { category:'공통', text:'작업 전 위험성평가 실시', required:true },
  { category:'공통', text:'작업허가서 소지 및 게시', required:true },
  { category:'공통', text:'개인보호구(PPE) 착용 상태', required:true },
  { category:'공통', text:'작업구역 안전표지 및 통제', required:true },
  { category:'공통', text:'비상연락체계 확인', required:false },
  { category:'화재·폭발', text:'인화성 물질 격리', required:true },
  { category:'화재·폭발', text:'소화기 비치 상태', required:true },
  { category:'화재·폭발', text:'화기감시자 배치', required:false },
  { category:'전기·감전', text:'전원 차단 및 잠금(LOTO)', required:true },
  { category:'전기·감전', text:'절연 상태 확인', required:true },
  { category:'추락·낙하', text:'안전난간·안전대 부착설비', required:true },
  { category:'추락·낙하', text:'추락방지망 설치', required:false },
  { category:'기타', text:'작업환경 정리정돈', required:false }
];

// ═══ 카테고리 아이콘 매핑 ═══
var CATEGORY_ICONS = {
  '공통':'📋', '화재·폭발':'🔥', '전기·감전':'⚡',
  '추락·낙하':'🪜', '밀폐공간':'🚪', '중량물':'🏗️',
  '유해가스':'☠️', '기타':'📌'
};

// ═══ INIT ═══
window.addEventListener('DOMContentLoaded', function(){
  initTheme();
  loadSession();
  loadFromUrl();
  renderChecklist();
  updateProgress();
  
  // ESC / 오버레이 클릭
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){
      var ov = document.getElementById('confirmOverlay');
      if(ov && ov.classList.contains('active')) closeConfirm(false);
    }
  });
  document.getElementById('confirmOverlay').addEventListener('click', function(e){
    if(e.target === this) closeConfirm(false);
  });
});

// ═══ 테마 ═══
function initTheme(){
  var saved = localStorage.getItem('theme') || 'light';
  applyTheme(saved);
}
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('theme', t);
}
function toggleTheme(){
  var cur = document.documentElement.getAttribute('data-theme') || 'light';
  applyTheme(cur === 'dark' ? 'light' : 'dark');
}

// ═══ 세션에서 점검자 정보 로드 ═══
function loadSession(){
  try{
    var raw = sessionStorage.getItem('appSession') || localStorage.getItem('appSession');
    if(!raw) return;
    var s = JSON.parse(raw);
    inspectionData.inspectorName = s.name || s.userName || '점검자';
    inspectionData.inspectorDept = s.dept || s.department || '';
  }catch(e){
    console.warn('[안전점검] 세션 로드 실패:', e);
  }
}

// ═══ URL 파라미터 처리 ═══
function loadFromUrl(){
  var params = new URLSearchParams(location.search);
  var permitNo = params.get('permitNo');
  var workId = params.get('workId');
  
  if(permitNo){
    inspectionData.permitNo = permitNo;
    loadPermitInfo(permitNo);
    
    // 상단 배지
    var badge = document.getElementById('permitBadge');
    if(badge) badge.textContent = permitNo;
  } else if(workId){
    inspectionData.workId = workId;
    loadWorkInfo(workId);
  }
}

function loadPermitInfo(permitNo){
  try{
    var permits = JSON.parse(localStorage.getItem('safetyPermits') || '[]');
    var permit = permits.find(function(p){ return p.permitNo === permitNo; });
    if(!permit){
      console.warn('[안전점검] 허가서 없음:', permitNo);
      return;
    }
    
    selectedPermit = permit;
    inspectionData.workId = permit.workId || permit.sourceWorkId || '';
    inspectionData.workName = permit.workName || '';
    inspectionData.location = (permit.location || '') + 
                              (permit.detailLocation ? ' ' + permit.detailLocation : '');
    
    // 통합 안전 체크리스트 로드 (허가서에 있으면 사용, 없으면 기본)
    if(permit.safetyChecklist && Array.isArray(permit.safetyChecklist) && permit.safetyChecklist.length > 0){
      inspectionData.checklist = permit.safetyChecklist.map(function(item){
        return {
          category: item.category || '기타',
          text: item.text || item.item || '',
          required: !!item.required,
          judgment: '',
          memo: ''
        };
      });
      console.log('[안전점검] 허가서 체크리스트 로드:', inspectionData.checklist.length + '건');
    } else {
      inspectionData.checklist = DEFAULT_CHECKLIST.map(function(item){
        return Object.assign({}, item, { judgment:'', memo:'' });
      });
      console.log('[안전점검] 기본 체크리스트 사용');
    }
    
    // 상단 정보 표시
    updateWorkInfoDisplay();
    
  }catch(e){
    console.error('[안전점검] 허가서 로드 오류:', e);
    inspectionData.checklist = DEFAULT_CHECKLIST.map(function(i){ return Object.assign({}, i, {judgment:'', memo:''}); });
  }
}

function loadWorkInfo(workId){
  try{
    var raw = localStorage.getItem('safetyDatabase');
    if(!raw) return;
    var db = JSON.parse(raw);
    var work = (db.workHistory || []).find(function(w){
      var wid = w.workId || (w.date + '_' + (w.originalNo || ''));
      return wid === workId;
    });
    if(!work) return;
    
    inspectionData.workName = work.workName || work.workNameFull || '';
    inspectionData.location = work.locationRaw || (work.location && work.location.raw) || '';
    inspectionData.checklist = DEFAULT_CHECKLIST.map(function(i){ return Object.assign({}, i, {judgment:'', memo:''}); });
    
    updateWorkInfoDisplay();
  }catch(e){
    console.error('[안전점검] 작업 로드 오류:', e);
  }
}

function updateWorkInfoDisplay(){
  var card = document.getElementById('workInfo');
  if(!card) return;
  
  card.style.display = 'block';
  setText('infoPermitNo', inspectionData.permitNo || '-');
  setText('infoWorkName', inspectionData.workName || '-');
  setText('infoLocation', inspectionData.location || '-');
  setText('infoInspector', 
    (inspectionData.inspectorName || '-') + 
    (inspectionData.inspectorDept ? ' (' + inspectionData.inspectorDept + ')' : '')
  );
}

// ═══ 체크리스트 렌더링 (카테고리 그룹핑) ═══
function renderChecklist(){
  var container = document.getElementById('checklistContainer');
  if(!container) return;
  
  if(inspectionData.checklist.length === 0){
    container.innerHTML = '<div style="text-align:center;padding:30px;color:var(--sub);">점검 항목이 없습니다.</div>';
    return;
  }
  
  // 카테고리별 그룹핑
  var groups = {};
  var categoryOrder = [];
  inspectionData.checklist.forEach(function(item, idx){
    var cat = item.category || '기타';
    if(!groups[cat]){
      groups[cat] = [];
      categoryOrder.push(cat);
    }
    groups[cat].push({ item:item, idx:idx });
  });
  
  var html = '';
  categoryOrder.forEach(function(cat){
    var items = groups[cat];
    var doneCount = items.filter(function(x){ return x.item.judgment; }).length;
    var isComplete = doneCount === items.length;
    var ico = CATEGORY_ICONS[cat] || '📌';
    
    html += '<div class="category-section">';
    html +=   '<div class="category-header">';
    html +=     '<span class="category-ico">' + ico + '</span>';
    html +=     '<span class="category-title">' + escHtml(cat) + '</span>';
    html +=     '<span class="category-progress ' + (isComplete ? 'complete' : '') + '">' + doneCount + '/' + items.length + '</span>';
    html +=   '</div>';
    
    items.forEach(function(entry){
      var item = entry.item;
      var idx = entry.idx;
      var isViolation = item.judgment === 'ng';
      var numClass = item.judgment === 'ng' ? 'ng' : (item.judgment ? 'done' : '');
      
      html += '<div class="check-item ' + (isViolation ? 'violation' : '') + '" id="checkItem' + idx + '">';
      html +=   '<div class="check-item-top">';
      html +=     '<div class="check-num ' + numClass + '" id="checkNum' + idx + '">' + (idx+1) + '</div>';
      html +=     '<div class="check-body">';
      html +=       '<div class="check-text">' + escHtml(item.text);
      if(item.required){
        html +=       '<span class="check-required">필수</span>';
      }
      html +=       '</div>';
      html +=     '</div>';
      html +=   '</div>';
      
      // 3단계 판정 버튼
      html +=   '<div class="judge-btns">';
      html +=     '<button class="judge-btn ' + (item.judgment==='ok'?'active-ok':'') + '" ' +
                  'onclick="setJudge(' + idx + ',\'ok\')">⭕ 준수</button>';
      html +=     '<button class="judge-btn ' + (item.judgment==='ng'?'active-ng':'') + '" ' +
                  'onclick="setJudge(' + idx + ',\'ng\')">❌ 미준수</button>';
      html +=     '<button class="judge-btn ' + (item.judgment==='na'?'active-na':'') + '" ' +
                  'onclick="setJudge(' + idx + ',\'na\')">➖ 해당없음</button>';
      html +=   '</div>';
      
      // 미준수 메모
      if(isViolation){
        html += '<div class="violation-memo">';
        html +=   '<div class="violation-memo-label">📝 미준수 사유 및 개선 계획</div>';
        html +=   '<textarea class="violation-memo-input" ' +
                  'oninput="updateMemo(' + idx + ', this.value)" ' +
                  'placeholder="미준수 사유와 개선 조치를 입력하세요">' + escHtml(item.memo || '') + '</textarea>';
        html += '</div>';
      }
      
      html += '</div>';
    });
    
    html += '</div>';
  });
  
  container.innerHTML = html;
}

// ═══ 판정 설정 ═══
function setJudge(idx, judgment){
  if(!inspectionData.checklist[idx]) return;
  
  inspectionData.checklist[idx].judgment = judgment;
  if(judgment !== 'ng'){
    inspectionData.checklist[idx].memo = '';
  }
  
  renderChecklist();
  updateProgress();
}

function updateMemo(idx, value){
  if(inspectionData.checklist[idx]){
    inspectionData.checklist[idx].memo = value;
  }
}

// ═══ 진행률 업데이트 ═══
function updateProgress(){
  var total = inspectionData.checklist.length;
  var done = inspectionData.checklist.filter(function(i){ return i.judgment; }).length;
  var ng = inspectionData.checklist.filter(function(i){ return i.judgment === 'ng'; }).length;
  
  setText('progressCount', done + ' / ' + total);
  var pct = total > 0 ? (done / total * 100) : 0;
  var fill = document.getElementById('progressFill');
  if(fill){
    fill.style.width = pct + '%';
    fill.classList.toggle('warn', ng > 0);
  }
  
  // 경고 배너
  var banner = document.getElementById('warnBanner');
  var bannerMsg = document.getElementById('warnBannerMsg');
  if(ng > 0){
    banner.style.display = 'block';
    bannerMsg.innerHTML = '미준수 항목 <strong>' + ng + '건</strong>이 있습니다. 개선 조치가 필요합니다.';
  } else {
    banner.style.display = 'none';
  }
  
  // 저장 버튼 활성화 (모든 항목 판정 시)
  var saveBtn = document.getElementById('saveBtn');
  if(saveBtn){
    saveBtn.disabled = (done < total);
    if(done === total){
      saveBtn.textContent = '💾 점검 결과 저장';
    } else {
      saveBtn.textContent = '💾 저장 (' + done + '/' + total + ')';
    }
  }
}

// ═══ 사진 첨부 ═══
function onPhotoSelect(event, slotIdx){
  var file = event.target.files[0];
  if(!file) return;
  
  if(file.size > 5 * 1024 * 1024){
    showToast('❌ 파일 크기는 5MB 이하여야 합니다', 'danger');
    event.target.value = '';
    return;
  }
  
  var reader = new FileReader();
  reader.onload = function(e){
    inspectionData.photos[slotIdx - 1] = e.target.result;
    renderPhotoSlot(slotIdx);
    showToast('📷 사진이 첨부되었습니다', 'success');
  };
  reader.readAsDataURL(file);
}

function renderPhotoSlot(slotIdx){
  var slot = document.getElementById('photoSlot' + slotIdx);
  var photo = inspectionData.photos[slotIdx - 1];
  
  if(!slot) return;
  
  if(photo){
    slot.className = 'photo-slot filled';
    slot.innerHTML = 
      '<img src="' + photo + '" alt="사진 ' + slotIdx + '">' +
      '<button class="photo-remove" onclick="event.preventDefault();removePhoto(' + slotIdx + ')">×</button>';
  } else {
    slot.className = 'photo-slot';
    slot.innerHTML = 
      '<div class="photo-slot-ico">📷</div>' +
      '<div class="photo-slot-txt">사진 ' + slotIdx + '</div>';
  }
}

function removePhoto(slotIdx){
  inspectionData.photos[slotIdx - 1] = null;
  document.getElementById('photoInput' + slotIdx).value = '';
  renderPhotoSlot(slotIdx);
}

// ═══ 저장 ═══
function saveInspection(){
  var total = inspectionData.checklist.length;
  var done = inspectionData.checklist.filter(function(i){ return i.judgment; }).length;
  
  if(done < total){
    showToast('모든 항목을 판정해주세요 (' + done + '/' + total + ')', 'warn');
    return;
  }
  
  // 미준수 필수 항목 체크 → 작업중지권 자동 발동
  var requiredNg = inspectionData.checklist.filter(function(i){ 
    return i.judgment === 'ng' && i.required; 
  });
  var totalNg = inspectionData.checklist.filter(function(i){ return i.judgment === 'ng'; });
  
  // 필수 미준수 있을 때 → 강력 경고 + 작업중지 유도
  if(requiredNg.length > 0){
    showConfirm({
      ico: '🚨',
      title: '필수 항목 미준수 발견',
      msg: '필수 항목 ' + requiredNg.length + '건이 미준수 상태입니다.\n\n' +
           '즉시 작업중지가 필요할 수 있습니다.\n' +
           '작업중지권 화면으로 이동하시겠습니까?\n\n' +
           '(점검 결과는 저장됩니다)',
      okText: '작업중지 신고',
      okType: 'danger'
    }, function(ok){
      if(ok){
        performSave('중대위반');
        redirectToStopWork(requiredNg);
      } else {
        // 취소 시에도 저장은 진행 (일반 위반으로)
        performSave('미준수');
        showCompleteAndExit();
      }
    });
    return;
  }
  
  // 일반 미준수만 있을 때
  if(totalNg.length > 0){
    showConfirm({
      ico: '⚠️',
      title: '미준수 항목 확인',
      msg: '미준수 항목 ' + totalNg.length + '건이 있습니다.\n\n' +
           '점검 결과를 저장하시겠습니까?\n' +
           '(개선 조치 후 재점검 권장)',
      okText: '저장',
      okType: 'warn'
    }, function(ok){
      if(ok){
        performSave('미준수');
        showCompleteAndExit();
      }
    });
    return;
  }
  
  // 모두 준수
  showConfirm({
    ico: '✅',
    title: '점검 결과 저장',
    msg: '모든 항목이 준수 상태입니다.\n점검 결과를 저장하시겠습니까?',
    okText: '저장'
  }, function(ok){
    if(ok){
      performSave('적합');
      showCompleteAndExit();
    }
  });
}

// ═══ 실제 저장 처리 ═══
function performSave(status){
  try{
    var now = new Date();
    var inspectionNo = generateInspectionNo();
    
    inspectionData.inspectionNo = inspectionNo;
    inspectionData.status = status;
    inspectionData.opinion = document.getElementById('opinionInput').value.trim();
    inspectionData.createdAt = now.toISOString();
    
    // localStorage 저장
    var list = JSON.parse(localStorage.getItem('safetyInspections') || '[]');
    var record = {
      inspectionNo: inspectionNo,
      workId: inspectionData.workId,
      permitNo: inspectionData.permitNo,
      workName: inspectionData.workName,
      location: inspectionData.location,
      inspectorName: inspectionData.inspectorName,
      inspectorDept: inspectionData.inspectorDept,
      checklist: inspectionData.checklist,
      photos: inspectionData.photos.filter(function(p){ return p; }),
      opinion: inspectionData.opinion,
      status: status,
      violationCount: inspectionData.checklist.filter(function(i){ return i.judgment==='ng'; }).length,
      requiredViolationCount: inspectionData.checklist.filter(function(i){ return i.judgment==='ng' && i.required; }).length,
      createdAt: now.toISOString(),
      date: fmtDate(now),
      schemaVersion: 1
    };
    
    list.push(record);
    localStorage.setItem('safetyInspections', JSON.stringify(list));
    console.log('[안전점검] 저장 완료:', inspectionNo);
    
    // Firestore 저장 (비동기)
    saveInspectionToFirestore(record);
    
    // 대시보드 이벤트
    try{
      window.dispatchEvent(new CustomEvent('app-data-changed', {
        detail: { key:'safetyInspections', timestamp: Date.now() }
      }));
    }catch(e){}
    
  }catch(e){
    console.error('[안전점검] 저장 실패:', e);
    showToast('❌ 저장 중 오류: ' + e.message, 'danger');
  }
}

// ═══ Firestore 저장 ═══
async function saveInspectionToFirestore(record){
  try{
    if(!window.firebaseApp || !window.firebaseApp.db) return;
    if(!navigator.onLine) return;
    
    var fb = window.firebaseApp;
    var col = fb.INSPECTION_COLLECTION;
    var docRef = fb.doc(fb.db, col, record.inspectionNo);
    
    var timeout = new Promise(function(_, rej){
      setTimeout(function(){ rej(new Error('타임아웃')); }, 15000);
    });
    
    await Promise.race([fb.setDoc(docRef, record), timeout]);
    console.log('[안전점검] Firestore 저장 완료');
  }catch(e){
    console.warn('[안전점검] Firestore 저장 실패:', e.message);
  }
}

// ═══ 작업중지권으로 자동 이동 ═══
function redirectToStopWork(violations){
  // 작업중지권으로 넘길 데이터 준비
  var stopReasons = [];
  violations.forEach(function(v){
    // 카테고리 → 사유 매핑
    if(v.category === '화재·폭발') stopReasons.push('화재·폭발 위험');
    else if(v.category === '전기·감전') stopReasons.push('감전 위험');
    else if(v.category === '추락·낙하') stopReasons.push('추락 위험');
    else if(v.category === '밀폐공간') stopReasons.push('밀폐공간 질식');
    else if(v.category === '중량물') stopReasons.push('중량물 낙하');
    else stopReasons.push('기타 위험');
  });
  // 중복 제거
  stopReasons = stopReasons.filter(function(v, i, a){ return a.indexOf(v) === i; });
  
  var pendingData = {
    inspectionNo: inspectionData.inspectionNo,
    workId: inspectionData.workId,
    permitNo: inspectionData.permitNo,
    workName: inspectionData.workName,
    location: inspectionData.location,
    stopReasons: stopReasons,
    stopDescription: '안전점검 결과 필수 항목 ' + violations.length + '건 미준수 발견\n\n' +
                     violations.map(function(v, i){
                       return (i+1) + '. [' + v.category + '] ' + v.text + 
                              (v.memo ? '\n   → ' + v.memo : '');
                     }).join('\n'),
    violations: violations.map(function(v){
      return {
        category: v.category,
        text: v.text,
        memo: v.memo || '(사유 미기재)'
      };
    }),
    requesterName: inspectionData.inspectorName,
    requesterDept: inspectionData.inspectorDept,
    requesterPosition: '안전점검자'
  };
  
  localStorage.setItem('pendingStopWorkOrder', JSON.stringify(pendingData));
  
  showToast('🚨 작업중지권 화면으로 이동합니다', 'danger');
  
  // 0.5초 후 이동 (토스트 보여주기)
  setTimeout(function(){
    var url = 'stop-work.html?from=inspection';
    if(inspectionData.permitNo) url += '&permitNo=' + encodeURIComponent(inspectionData.permitNo);
    if(inspectionData.workId) url += '&workId=' + encodeURIComponent(inspectionData.workId);
    
    if(typeof window.navigateWithFade === 'function'){
      window.navigateWithFade(url);
    } else {
      location.href = url;
    }
  }, 500);
}

// ═══ 완료 후 대시보드로 ═══
function showCompleteAndExit(){
  showToast('✅ 점검 결과가 저장되었습니다', 'success');
  setTimeout(function(){
    goHome();
  }, 1000);
}

// ═══ 점검 번호 생성 ═══
function generateInspectionNo(){
  var today = fmtDate(new Date()).replace(/-/g, '');
  try{
    var list = JSON.parse(localStorage.getItem('safetyInspections') || '[]');
    var cnt = list.filter(function(i){
      return i.inspectionNo && i.inspectionNo.startsWith('IN-' + today);
    }).length;
    return 'IN-' + today + '-' + String(cnt + 1).padStart(3, '0');
  }catch(e){
    return 'IN-' + today + '-001';
  }
}

// ═══ 다이얼로그 ═══
var confirmCallback = null;
function showConfirm(opts, cb){
  document.getElementById('confirmIco').textContent = opts.ico || '⚠️';
  document.getElementById('confirmTitle').textContent = opts.title || '확인';
  document.getElementById('confirmMsg').textContent = opts.msg || '';
  
  var okBtn = document.getElementById('confirmOkBtn');
  okBtn.textContent = opts.okText || '확인';
  okBtn.className = 'confirm-btn confirm-btn-ok';
  if(opts.okType === 'danger') okBtn.classList.add('danger');
  else if(opts.okType === 'warn') okBtn.classList.add('warn');
  
  confirmCallback = cb || function(){};
  document.getElementById('confirmOverlay').classList.add('active');
}
function closeConfirm(result){
  document.getElementById('confirmOverlay').classList.remove('active');
  var cb = confirmCallback;
  confirmCallback = null;
  if(cb) setTimeout(function(){ cb(result); }, 150);
}

// ═══ 네비게이션 ═══
function goHome(){
  var url = '안전관리플랫폼_대시보드_V6_.html';
  if(typeof window.navigateWithFade === 'function'){
    window.navigateWithFade(url);
  } else {
    location.href = url;
  }
}

function goBack(){
  // 판정한 항목이 있으면 확인
  var hasData = inspectionData.checklist.some(function(i){ return i.judgment; });
  
  if(hasData){
    showConfirm({
      ico: '⚠️',
      title: '점검 중단',
      msg: '작성 중인 점검 결과가 있습니다.\n저장하지 않고 나가시겠습니까?',
      okText: '나가기',
      okType: 'warn'
    }, function(ok){
      if(ok){
        if(window.history.length > 1) history.back();
        else goHome();
      }
    });
    return;
  }
  
  if(window.history.length > 1) history.back();
  else goHome();
}

// ═══ 유틸 ═══
function pad(n){ return ('0' + n).slice(-2); }
function fmtDate(d){
  d = d || new Date();
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
}
function setText(id, v){
  var el = document.getElementById(id);
  if(el) el.textContent = v;
}
function escHtml(s){
  return String(s || '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}
function showToast(msg, type){
  var wrap = document.getElementById('toastWrap');
  if(!wrap) return;
  var t = document.createElement('div');
  t.className = 'toast ' + (type || 'info');
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 3500);
}

// 페이지 페이드아웃 전환
window.navigateWithFade = function(url){
  document.body.style.opacity = '0';
  document.body.style.transition = 'opacity .2s';
  setTimeout(function(){ location.href = url; }, 200);
};
</script>
