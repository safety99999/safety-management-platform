            gap: 1.5rem;
            max-width: 1200px;
            margin: 0 auto;

            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            transition: transform 0.2s ease-in-out;

            margin-bottom: 1rem;

            color: var(--primary-deep-blue);
        }

        .card-icon {
            font-size: 1.5rem;
            color: var(--accent-gold);
        }

        .welcome-section {
            grid-column: 1 / -1;

            color: var(--text-light);

            justify-content: space-between;
            align-items: center;

            color: var(--secondary-blue);
            line-height: 1;
        }

            font-size: 1.2rem;
            margin-left: 5px;
            color: var(--text-dark);
            opacity: 0.7;
        }

        .kpi-status {
            margin-top: 0.5rem;

            align-items: center;
            gap: 5px;
        }

        .status-danger { color: var(--danger-red); }

            font-size: 0.95rem;

            background-color: #f9f9f9;
            color: var(--primary-deep-blue);
        }

        }
